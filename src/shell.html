<script>
// Icono y metadatos de instalación van en <head>, que es donde Safari los busca al añadir a la pantalla de inicio.
(function () {
  try {
    var h = document.head, url = new URL('apple-touch-icon.png', location.href).href;
    document.body && document.body.querySelectorAll('meta[name="apple-mobile-web-app-capable"],meta[name="mobile-web-app-capable"],meta[name="apple-mobile-web-app-status-bar-style"],meta[name="theme-color"],meta[name="apple-mobile-web-app-title"],link[rel="manifest"]').forEach(function (n) { h.appendChild(n); });
    [['apple-touch-icon'], ['icon', 'image/png']].forEach(function (x) {
      h.querySelectorAll('link[rel="' + x[0] + '"]').forEach(function (l) { l.remove(); });
      var l = document.createElement('link'); l.rel = x[0]; l.href = url; l.setAttribute('sizes', '1024x1024'); if (x[1]) l.type = x[1]; h.appendChild(l);
    });
    var t = localStorage.getItem('parla1:theme');
    document.documentElement.setAttribute('data-app-theme', t || 'dark');
  } catch (e) { document.documentElement.setAttribute('data-app-theme', 'dark'); }
})();
</script>

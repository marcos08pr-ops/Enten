const CEFR_NAME = { A1: 'Acceso', A2: 'Plataforma', B1: 'Umbral', B2: 'Avanzado', C1: 'Dominio' };
const cefrIdx = (c) => Math.max(0, CEFR.indexOf(String(c || 'A1').slice(0, 2)));
/* Gramática de las unidades 1-12 (las nuevas la traen en su campo gr) */
const UNIT_GR = {
  ca: { hola: ['drill:articles'], jo: ['conj:pres', 'drill:personal'], menjar: ['drill:articles', 'drill:contraccions'], familia: ['drill:possessius'], numeros: ['drill:plurals'], ciutat: ['drill:contraccions', 'drill:demostratius'],
    dia: ['conj:pres'], oci: ['drill:adjectius'], viatge: ['conj:fut', 'drill:preposicions'], ahir: ['conj:perif', 'conj:perfet'], sentir: ['drill:serestar', 'drill:adjectius'], feina: ['conj:cond', 'drill:possessius'] },
  de: { hallo: ['drill:artikel'], ich: ['conj:pres'], essen: ['drill:akkusativ'], familie: ['drill:possessiv'], zahlen: ['drill:plural'], stadt: ['drill:praepositionen'],
    tag: ['drill:trennbar', 'conj:pres'], freizeit: ['drill:akkusativ'], reisen: ['drill:dativ', 'drill:praepositionen'], gestern: ['conj:perfekt'], gefuehle: ['drill:pronomen', 'drill:adjektiv'], arbeit: ['drill:wortstellung'] },
};
/* Tipo de error de cada tema (para la memoria del tutor) */
const DRILL_ERR = {
  articles: 'determiners', personal: 'determiners', contraccions: 'determiners', possessius: 'determiners', demostratius: 'determiners', artikel: 'determiners', possessiv: 'determiners',
  plurals: 'agreement', adjectius: 'agreement', plural: 'agreement', adjektiv: 'agreement',
  febles: 'pronouns', febles2: 'pronouns', relatius: 'pronouns', pronomen: 'pronouns', relativ: 'pronouns',
  akkusativ: 'cases', dativ: 'cases', genitiv: 'cases', wechsel: 'cases', praepositionen: 'prepositions', preposicions: 'prepositions',
  subjuntiu: 'mood', konj1: 'mood', serestar: 'grammar', accents: 'accent', connectors: 'connectors', konnektoren: 'connectors', wortstellung: 'order', trennbar: 'order', passiv: 'grammar', registre: 'grammar',
};
const Gram = {
  verbsData(lang) { return lang === 'ca' ? (typeof VERBS_CA !== 'undefined' ? VERBS_CA : null) : lang === 'de' ? (typeof VERBS_DE !== 'undefined' ? VERBS_DE : null) : null; },
  drills(lang) { return lang === 'ca' ? (typeof DRILLS_CA !== 'undefined' ? DRILLS_CA : []) : lang === 'de' ? (typeof DRILLS_DE !== 'undefined' ? DRILLS_DE : []) : []; },
  drill(lang, id) { return this.drills(lang).find((d) => d.id === id) || null; },
  tense(lang, id) { const V = this.verbsData(lang); return V ? V.tenses.find((t) => t.id === id) || null : null; },
  has(lang) { return !!this.verbsData(lang) || this.drills(lang).length > 0; },
  /* formas de un tiempo: [[canónica, alternativas…] × 6] */
  forms(v, tense) { const s = v.f && v.f[tense]; return s ? s.split('|').map((x) => x.split(';').map((y) => y.trim()).filter(Boolean)) : null; },
  parse(lang, d, s, i) {
    const f = s.split('|'), id = lang + ':gr:' + d.id + ':' + i;
    if (f[0] === 'ORDER') return { kind: 'order', id, t: f[1], es: f[2] || '', why: f[3] || '' };
    return { kind: 'cloze', id, q: f[0], ans: (f[1] || '').split(';').map((x) => x.trim()).filter(Boolean), opts: (f[2] || '').split(';').map((x) => x.trim()).filter(Boolean), es: f[3] || '', why: f[4] || '' };
  },
  items(lang, d) { return d.items.map((s, i) => this.parse(lang, d, s, i)); },
  /* ---- ejercicios para el reproductor de lecciones ---- */
  drillEx(lang, d, it, level, pool) {
    const rng = Math.random;
    if (it.kind === 'order') {
      const item = { id: it.id, k: 's', t: it.t, alt: [], es: it.es, altEs: [], unit: 'gram' };
      const others = (pool || []).filter((x) => x.kind === 'order' && x.id !== it.id).map((x) => ({ id: x.id, k: 's', t: x.t, es: x.es }));
      const e = mkBank(item, others, 'es2t', level === 'facil' ? 0 : level === 'normal' ? 1 : 2, rng);
      e.why = it.why; e.drill = d.id; e.gram = true; e.title = d.name;
      return e;
    }
    const typed = (level === 'dificil' && rng() < 0.5) || level === 'experto';
    const full = it.q.replace('___', it.ans[0]);
    return { type: 'gram', mode: typed ? 'type' : 'choice', drill: d.id, title: d.name, why: it.why, q: it.q, answer: it.ans[0], answers: it.ans,
      options: shuffle([it.ans[0]].concat(it.opts.filter((o) => it.ans.map(canon).indexOf(canon(o)) < 0).slice(0, 3)), rng), item: { id: it.id, k: 's', t: full, es: it.es, alt: [], altEs: [] } };
  },
  conjEx(lang, v, tenseId, p, level) {
    const V = this.verbsData(lang), T = this.tense(lang, tenseId), forms = this.forms(v, tenseId); if (!forms) return null;
    const ans = forms[p], rng = Math.random;
    const pool = uniq(forms.map((x) => x[0]).concat(V.tenses.map((t) => { const f = this.forms(v, t.id); return f ? f[p][0] : null; }).filter(Boolean)));
    const distract = shuffle(pool.filter((x) => ans.map(canon).indexOf(canon(x)) < 0), rng).slice(0, 3);
    const typed = level === 'dificil' || level === 'experto' || (level === 'normal' && rng() < 0.35);
    return { type: 'conj', mode: typed ? 'type' : 'choice', verb: v, tense: T, person: V.persons[p], answers: ans, answer: ans[0],
      options: shuffle([ans[0]].concat(distract), rng), item: { id: lang + ':cj:' + v.inf + ':' + tenseId + ':' + p, k: 's', t: V.persons[p].split(' / ')[0] + ' ' + ans[0], es: v.es, alt: [], altEs: [] } };
  },
  /* tiempos disponibles hasta un nivel */
  tensesUpTo(lang, cefr) { const V = this.verbsData(lang); return V ? V.tenses.filter((t) => cefrIdx(t.cefr) <= cefrIdx(cefr)) : []; },
  verbsUpTo(lang, cefr) { const V = this.verbsData(lang); return V ? V.verbs.filter((v) => cefrIdx(v.cefr) <= Math.max(cefrIdx(cefr), 1)) : []; },
  conjSession(lang, o) {
    const V = this.verbsData(lang); if (!V) return [];
    const tenses = (o.tenses && o.tenses.length ? o.tenses : V.tenses.map((t) => t.id)).filter((t) => this.tense(lang, t));
    const verbs = o.verbs && o.verbs.length ? V.verbs.filter((v) => o.verbs.indexOf(v.inf) >= 0) : V.verbs;
    const out = []; let guard = 0;
    while (out.length < (o.n || 12) && guard++ < 200) {
      const v = verbs[rand(verbs.length)], t = tenses[rand(tenses.length)], p = rand(6);
      const e = this.conjEx(lang, v, t, p, o.level || P.profile.level);
      if (e && !out.some((x) => x.item.id === e.item.id)) out.push(e);
    }
    return out;
  },
  drillSession(lang, ids, n, level) {
    const ds = ids.map((id) => this.drill(lang, id)).filter(Boolean); if (!ds.length) return [];
    const all = ds.flatMap((d) => this.items(lang, d).map((it) => ({ d, it })));
    const c = P.course(lang) || {};
    // primero lo que más falla esta persona, luego al azar
    const weak = SRS.weak(c, all.map((x) => x.it.id));
    const order = uniq(weak.concat(shuffle(all.map((x) => x.it.id)))).slice(0, n || 12);
    return order.map((id) => all.find((x) => x.it.id === id)).map((x) => this.drillEx(lang, x.d, x.it, level || P.profile.level, all.filter((y) => y.d === x.d).map((y) => y.it)));
  },
  /* ejercicios de gramática para una lección de unidad (según su campo gr) */
  forUnit(lang, u, n, level) {
    const gr = (u.gr && u.gr.length ? u.gr : (UNIT_GR[lang] || {})[u.id]) || [];
    const out = [];
    for (let k = 0; k < n * 3 && out.length < n; k++) {
      const g = gr[k % gr.length]; if (!g) break;
      const [kind, id] = g.split(':');
      if (kind === 'conj') { const V = this.verbsData(lang); if (!V) continue; const vs = this.verbsUpTo(lang, u.cefr); const e = this.conjEx(lang, vs[rand(vs.length)] || V.verbs[0], id, rand(6), level); if (e) out.push(e); }
      else if (kind === 'drill') { const d = this.drill(lang, id); if (!d) continue; const its = this.items(lang, d); const it = its[rand(its.length)]; out.push(this.drillEx(lang, d, it, level, its)); }
    }
    return out;
  },
};

// ---- 08-progress.js ----
/* ============ Parla · perfil, racha, XP, misiones, memoria del tutor ============ */
const DAY_MIN = 10;       // XP mínimos en un día para mantener la racha (≈ una lección)
const FREEZE_COST = 100;  // gemas por protector de racha
const BOOST_COST = 80;    // gemas por 15 min de XP doble
const MAX_FREEZES = 2;

const Session = {
  noListenUntil: 0, noSpeakUntil: 0,
  noListen() { return Date.now() < this.noListenUntil; },
  noSpeak() { return Date.now() < this.noSpeakUntil; },
};

function defaultProfile() {
  return { v: 1, name: '', created: dayKey(), active: 'ca', langs: {}, goal: 20, level: 'normal', autoLevel: true, theme: 'dark', sound: true, rate: 0.95, voices: {},
    prefs: { styles: [], interests: [], motive: [], explain: 'breve', tone: 'divertido' }, reminder: { time: '20:30', on: true }, aiOk: false, onboarded: false };
}
function defaultStreak() { return { days: {}, frozen: {}, freezes: 1, gems: 50, best: 0, quests: null, repair: null, boost: 0, ms: [], events: [] }; }
function defaultStats() { return { xp: 0, lessons: 0, perfect: 0, chat: 0, speak: 0, listen: 0, games: 0, secs: 0, words: 0, night: false, early: false, badges: {}, acc: [] }; }
function defaultMemory() { return { mistakes: [], tags: {}, notes: [], summary: '', tip: null, updated: 0 }; }
function defaultCourse() { return { lessons: {}, unlocked: 0, srs: {}, custom: {}, gen: {}, placed: false, xp: 0 }; }

const P = {
  get profile() { return Store.get('profile'); },
  get streak() { return Store.get('streak'); },
  get stats() { return Store.get('stats'); },
  get memory() { return Store.get('memory'); },
  course(lang) { return Store.get('course_' + (lang || P.profile.active)); },
  save(name) { Store.save(name, Store.get(name)); },
  saveCourse(lang) { const n = 'course_' + (lang || P.profile.active); Store.save(n, Store.get(n)); },
  async loadCourse(lang) {
    const n = 'course_' + lang; let c = await Store.load(n);
    if (!c) { c = defaultCourse(); Store.save(n, c); }
    return c;
  },
  courseData(lang) { lang = lang || P.profile.active; const c = P.course(lang); return Course.get(lang, c && c.gen); },
};

/* ---------- racha ---------- */
const Streak = {
  active(k) { const s = P.streak; return (s.days[k] || 0) >= DAY_MIN || !!s.frozen[k]; },
  doneToday() { return (P.streak.days[dayKey()] || 0) >= DAY_MIN; },
  todayXP() { return P.streak.days[dayKey()] || 0; },
  count() {
    const s = P.streak; let k = dayKey(); let n = 0;
    if (!this.active(k)) k = addDays(k, -1);
    for (let guard = 0; guard < 4000 && this.active(k); guard++) { if ((s.days[k] || 0) >= DAY_MIN) n++; k = addDays(k, -1); }
    return n;
  },
  state() { return this.doneToday() ? 'on' : (this.count() > 0 && P.streak.frozen[addDays(dayKey(), -1)] ? 'ice' : 'off'); },
  /* Al abrir: gasta protectores en los días perdidos y detecta rachas rotas que aún se pueden recuperar. */
  reconcile() {
    const s = P.streak, today = dayKey(), ev = [];
    const keys = Object.keys(s.days).filter((k) => s.days[k] >= DAY_MIN).concat(Object.keys(s.frozen)).sort();
    const last = keys.filter((k) => k < today).pop();
    if (!last) return ev;
    const gap = dayDiff(last, today) - 1; // días sin actividad entre el último activo y hoy
    if (gap <= 0) return ev;
    // racha que había justo antes del hueco
    let n = 0, k = last; for (let g = 0; g < 4000 && this.active(k); g++) { if ((s.days[k] || 0) >= DAY_MIN) n++; k = addDays(k, -1); }
    let d = addDays(last, 1); const used = [];
    while (n > 0 && d < today && s.freezes > 0) { s.frozen[d] = 'freeze'; s.freezes--; used.push(d); d = addDays(d, 1); }
    if (used.length) ev.push({ type: 'frozen', days: used, streak: n });
    if (d < today && n >= 3) {
      const missing = []; for (let x = d; x < today; x = addDays(x, 1)) missing.push(x);
      if (missing.length <= 2 && (!s.repair || s.repair.day !== today)) {
        s.repair = { day: today, need: 3, done: 0, days: missing, lost: n };
        ev.push({ type: 'lost', streak: n, repairable: true });
      } else if (missing.length > 2) ev.push({ type: 'lost', streak: n, repairable: false });
    }
    if (s.repair && s.repair.day !== today) s.repair = null;
    P.save('streak');
    return ev;
  },
  /* Suma XP y devuelve qué ha pasado (racha ampliada, meta cumplida, hito…). */
  addXP(xp, src) {
    const s = P.streak, st = P.stats, pr = P.profile, today = dayKey();
    if (s.boost && Date.now() < s.boost) xp *= 2;
    const before = s.days[today] || 0, after = before + xp;
    const wasDone = before >= DAY_MIN, goal = pr.goal || 20;
    s.days[today] = after;
    st.xp = (st.xp || 0) + xp;
    const c = P.course(); if (c) c.xp = (c.xp || 0) + xp;
    // limita el historial a ~2 años
    const ks = Object.keys(s.days); if (ks.length > 800) ks.sort().slice(0, ks.length - 800).forEach((k) => delete s.days[k]);
    const r = { xp, extended: !wasDone && after >= DAY_MIN, goal: before < goal && after >= goal, streak: 0, milestone: 0, repaired: false };
    if (src === 'lesson' && s.repair && s.repair.day === today) {
      s.repair.done++;
      if (s.repair.done >= s.repair.need) { s.repair.days.forEach((d) => { s.frozen[d] = 'repair'; }); r.repaired = s.repair.lost; s.repair = null; }
    }
    r.streak = this.count();
    if (r.streak > (s.best || 0)) s.best = r.streak;
    if (r.extended || r.repaired) {
      const m = MILESTONES.filter((x) => x <= r.streak && (s.ms || []).indexOf(x) < 0).pop();
      if (m) { s.ms = (s.ms || []).concat(m); r.milestone = m; s.gems += m >= 30 ? 50 : 20; if (m === 7 || m === 30 || m === 100) s.freezes = Math.min(MAX_FREEZES, s.freezes + 1); }
    }
    Quests.bump('xp', xp);
    const h = new Date().getHours(); if (h >= 23) st.night = true; if (h < 7) st.early = true;
    P.save('streak'); P.save('stats'); P.saveCourse();
    Board.sync();
    Notify.syncState();
    return r;
  },
  weekXP() { const s = P.streak, wk = weekKey(); return Object.keys(s.days).filter((k) => weekKey(keyDate(k)) === wk).reduce((a, k) => a + s.days[k], 0); },
  last7() { const out = []; for (let i = 6; i >= 0; i--) { const k = addDays(dayKey(), -i); out.push({ k, xp: P.streak.days[k] || 0, ice: !!P.streak.frozen[k] }); } return out; },
};

/* ---------- misiones diarias (se eligen según tus preferencias) ---------- */
const Quests = {
  ensure() {
    const s = P.streak, today = dayKey();
    if (s.quests && s.quests.day === today) return s.quests.list;
    const rng = seeded(today + (P.profile.name || ''));
    const styles = (P.profile.prefs && P.profile.prefs.styles) || [];
    const pool = QUESTS.map((q) => ({ q, w: (q.pref && styles.indexOf(q.pref) >= 0 ? 3 : 1) * (q.id === 'xp' ? 2.5 : 1) }));
    const chosen = [];
    while (chosen.length < 3 && pool.length) {
      const tot = pool.reduce((a, x) => a + x.w, 0); let r = rng() * tot; let idx = 0;
      for (let i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) { idx = i; break; } }
      chosen.push(pool.splice(idx, 1)[0].q);
    }
    s.quests = { day: today, list: chosen.map((q) => ({ id: q.id, goal: q.goals[Math.floor(rng() * q.goals.length)], prog: 0, claimed: false })) };
    P.save('streak');
    return s.quests.list;
  },
  def(id) { return QUESTS.find((q) => q.id === id); },
  bump(metric, v) {
    const list = this.ensure(); let changed = false;
    list.forEach((x) => {
      const q = this.def(x.id); if (!q || q.metric !== metric || x.claimed) return;
      const np = q.max ? Math.max(x.prog, v) : x.prog + v;
      if (np !== x.prog) { x.prog = Math.min(np, x.goal); changed = true; }
      if (x.prog >= x.goal && !x.claimed) { x.claimed = true; P.streak.gems += q.gems; toast('Misión cumplida: ' + q.t(x.goal) + ' · +' + q.gems + ' 💎'); }
    });
    if (changed) P.save('streak');
  },
};

/* ---------- tienda ---------- */
const Shop = {
  buyFreeze() {
    const s = P.streak; if (s.freezes >= MAX_FREEZES) return 'max'; if (s.gems < FREEZE_COST) return 'gems';
    s.gems -= FREEZE_COST; s.freezes++; P.save('streak'); return 'ok';
  },
  buyBoost() {
    const s = P.streak; if (s.gems < BOOST_COST) return 'gems';
    s.gems -= BOOST_COST; s.boost = Math.max(Date.now(), s.boost || 0) + 15 * 60000; P.save('streak'); return 'ok';
  },
};

/* ---------- memoria del tutor: fallos, etiquetas y notas ---------- */
const ERR_NAMES = { conjugation: 'Conjugación verbal', determiners: 'Determinantes y artículos', agreement: 'Género y número', pronouns: 'Pronombres', cases: 'Casos (acusativo, dativo…)', prepositions: 'Preposiciones', mood: 'Subjuntivo y modos', connectors: 'Conectores', gender: 'Género y artículos', order: 'Orden de las palabras', missing: 'Palabras que faltan', spelling: 'Ortografía', accent: 'Tildes y signos', vocab: 'Vocabulario', grammar: 'Gramática', listening: 'Comprensión oral', speaking: 'Pronunciación', blank: 'Respuestas en blanco' };
const Memory = {
  record(lang, e, ok, res, given) {
    const m = P.memory; const err = res && res.err; if (ok && (!err || err === 'spelling')) return;
    const kind = !ok && (e.type === 'listen' || e.type === 'listenPick') ? 'listening' : !ok && e.type === 'speak' ? 'speaking' : err || 'vocab';
    m.tags[lang] = m.tags[lang] || {}; m.tags[lang][kind] = (m.tags[lang][kind] || 0) + (ok ? 0.3 : 1);
    if (ok) return;
    m.mistakes.push({ t: Date.now(), lang, id: e.item ? e.item.id : '', ex: e.type, q: e.item ? (e.dir === 't2es' ? e.item.t : e.item.es || e.item.t) : '', exp: res ? res.best : '', got: String(given || '').slice(0, 120), err: kind });
    if (m.mistakes.length > 150) m.mistakes = m.mistakes.slice(-150);
  },
  weak(lang, n) {
    const t = (P.memory.tags || {})[lang] || {};
    return Object.keys(t).filter((k) => t[k] >= 1).sort((a, b) => t[b] - t[a]).slice(0, n || 4);
  },
  recent(lang, n) { return P.memory.mistakes.filter((x) => x.lang === lang).slice(-(n || 10)); },
  /* Resumen que recibe la IA en cada consulta. */
  context(lang) {
    const pr = P.profile, m = P.memory, L = LANGS[lang];
    const st = pr.prefs || {};
    const lines = [];
    lines.push('Alumno: ' + (pr.name || 'sin nombre') + '. Lengua materna: castellano. Aprende ' + L.es + '.');
    const C = P.courseData(lang), c = P.course(lang);
    const cur = currentUnit(lang);
    lines.push('Nivel aproximado: ' + (C.units[cur] ? C.units[cur].cefr : 'A1') + ' (unidad ' + (cur + 1) + ' de ' + C.units.length + ': ' + (C.units[cur] ? C.units[cur].t : '') + '). Dificultad elegida: ' + LEVELS[pr.level].name + '.');
    if (st.styles && st.styles.length) lines.push('Le gusta aprender con: ' + st.styles.join(', ') + '.');
    if (st.interests && st.interests.length) lines.push('Intereses: ' + st.interests.join(', ') + '.');
    if (st.motive && st.motive.length) lines.push('Motivo: ' + st.motive.join(', ') + '.');
    lines.push('Explicaciones: ' + (st.explain === 'detallada' ? 'detalladas, con ejemplos' : 'breves y directas') + '. Tono: ' + (st.tone === 'serio' ? 'serio y claro' : 'cercano y con humor') + '.');
    const w = this.weak(lang, 4); if (w.length) lines.push('Puntos débiles detectados: ' + w.map((k) => ERR_NAMES[k] || k).join(', ') + '.');
    if (m.summary) lines.push('Lo que recuerdas de él/ella: ' + m.summary);
    const notes = (m.notes || []).slice(-12).map((x) => '- ' + x.text); if (notes.length) lines.push('Notas de memoria:\n' + notes.join('\n'));
    const rec = this.recent(lang, 8).map((x) => '- [' + (ERR_NAMES[x.err] || x.err) + '] esperado «' + x.exp + '», escribió «' + x.got + '»');
    if (rec.length) lines.push('Últimos fallos:\n' + rec.join('\n'));
    const weakIds = SRS.weak(c, Object.keys(c.srs || {})).slice(0, 8).map((id) => C.byId[id] || (c.custom || {})[id]).filter(Boolean).map((it) => it.t);
    if (weakIds.length) lines.push('Palabras o frases que más falla: ' + weakIds.join(' · '));
    return lines.join('\n');
  },
  /* Tras una lección o una charla, la IA actualiza su memoria (resumen + notas). */
  async consolidate(lang, extra) {
    if (!AI.ok() || !P.profile.aiOk) return;
    const m = P.memory;
    if (Date.now() - (m.updated || 0) < 3 * 60000 && !extra) return;
    m.updated = Date.now(); P.save('memory');
    try {
      const r = await AI.json({
        system: 'Eres el tutor de idiomas de una app tipo Duolingo. Mantienes una memoria breve sobre cada alumno para adaptar las clases.',
        prompt: Memory.context(lang) + (extra ? '\n\nNuevo material de esta sesión:\n' + extra : '') +
          '\n\nActualiza tu memoria del alumno. Devuelve {"summary": "máximo 450 caracteres en castellano: nivel real, errores recurrentes, gustos y cómo prefiere aprender", "notes": ["hasta 3 hechos NUEVOS y concretos sobre el alumno (gustos, metas, errores típicos) que no estén ya en las notas; [] si no hay"], "focus": ["2 o 3 cosas concretas a practicar la próxima vez"]}',
      });
      if (r && typeof r.summary === 'string') m.summary = r.summary.slice(0, 600);
      if (r && Array.isArray(r.notes)) r.notes.filter((x) => typeof x === 'string' && x.trim()).slice(0, 3).forEach((x) => addNote(x.trim().slice(0, 200), 'ai'));
      if (r && Array.isArray(r.focus)) m.focus = r.focus.filter((x) => typeof x === 'string').slice(0, 3);
      P.save('memory');
    } catch (e) { /* silencioso: es una mejora en segundo plano */ }
  },
};
function addNote(text, src) {
  const m = P.memory; m.notes = m.notes || [];
  if (m.notes.some((n) => canon(n.text) === canon(text))) return;
  m.notes.push({ id: 'n' + Date.now().toString(36) + rand(1000), text, t: Date.now(), src: src || 'user' });
  if (m.notes.length > 30) m.notes = m.notes.slice(-30);
  P.save('memory');
}

/* Ajuste automático de dificultad según la precisión de las últimas lecciones. */
function adaptLevel(acc) {
  const st = P.stats, pr = P.profile; st.acc = (st.acc || []).concat(Math.round(acc * 100) / 100).slice(-8);
  P.save('stats');
  if (!pr.autoLevel || st.acc.length < 3) return null;
  const last = st.acc.slice(-3), avg = last.reduce((a, b) => a + b, 0) / 3, i = LEVEL_ORDER.indexOf(pr.level);
  let to = null;
  if (avg >= 0.93 && i < 3) to = LEVEL_ORDER[i + 1];
  else if (avg < 0.6 && i > 0) to = LEVEL_ORDER[i - 1];
  if (to) { pr.level = to; st.acc = []; P.save('profile'); P.save('stats'); }
  return to;
}

/* ---------- progreso en el curso ---------- */
function lessonKey(u, i) { return u.id + ':' + i; }
function lessonDone(c, u, i) { return !!(c.lessons[lessonKey(u, i)] && c.lessons[lessonKey(u, i)].n) || u.idx < (c.unlocked || 0); }
function currentUnit(lang) {
  const C = P.courseData(lang), c = P.course(lang); if (!c) return 0;
  for (const u of C.units) for (let i = 0; i < 4; i++) if (!lessonDone(c, u, i)) return u.idx;
  return C.units.length - 1;
}
function nextLesson(lang) {
  const C = P.courseData(lang), c = P.course(lang);
  for (const u of C.units) for (let i = 0; i < 4; i++) if (!lessonDone(c, u, i)) return { u, i };
  return null;
}
function unitUnlocked(c, C, u) {
  if (u.idx === 0 || u.idx <= (c.unlocked || 0)) return true;
  const prev = C.units[u.idx - 1]; return lessonDone(c, prev, 2);
}
function lessonUnlocked(c, C, u, i) { if (!unitUnlocked(c, C, u)) return false; return i === 0 || lessonDone(c, u, i - 1); }
function countWords() {
  let n = 0; Object.keys(P.profile.langs || {}).forEach((l) => { const c = P.course(l); if (c) n += SRS.learned(c); });
  P.stats.words = n; return n;
}

/* ============ Parla · recordatorios para no perder la racha ============
   1) Dentro de la app: aviso de racha en peligro con cuenta atrás hasta medianoche.
   2) Calendario del iPhone: evento diario con alarma (archivo .ics) — funciona sin servidor.
   3) App instalada en la pantalla de inicio (fuera de Claude): número en el icono y notificaciones.
   4) Avisos push reales (opcional): ver README → «Avisos push». */
const APP_LINK = 'https://claude.ai/artifact/VQBQUga27MKw8UtAbrwhGr'; // enlace del artefacto privado de Claude
const Notify = {
  reg: null, cfg: null, timer: 0,
  hosted() { return !Store.inClaude && /^https?:$/.test(location.protocol); },
  standalone() { try { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } },
  link() { return this.hosted() ? location.href.split('#')[0] : APP_LINK; },
  async init() {
    if (this.hosted() && 'serviceWorker' in navigator) {
      try { this.reg = await navigator.serviceWorker.register('sw.js'); } catch (e) { this.reg = null; }
      try { const r = await fetch('push-config.json', { cache: 'no-store' }); if (r.ok) this.cfg = await r.json(); } catch (e) { this.cfg = null; }
    }
    this.schedule(); this.syncState();
  },
  perm() { return 'Notification' in window ? Notification.permission : 'unsupported'; },
  canLocal() { return this.hosted() && 'Notification' in window; },
  async request() { if (!('Notification' in window)) return 'unsupported'; try { return await Notification.requestPermission(); } catch (e) { return 'denied'; } },
  async show(title, body) {
    if (this.perm() !== 'granted') return;
    try { if (this.reg) await this.reg.showNotification(title, { body, icon: 'apple-touch-icon.png', tag: 'parla-racha' }); else new Notification(title, { body }); } catch (e) {}
  },
  /* Si la app está abierta a la hora del recordatorio y aún no has practicado. */
  schedule() {
    clearTimeout(this.timer); const r = P.profile && P.profile.reminder; if (!r || !r.on) return;
    const p = r.time.split(':').map(Number), at = new Date(); at.setHours(p[0], p[1], 0, 0);
    const ms = at - Date.now(); if (ms < 0) return;
    this.timer = setTimeout(() => {
      if (Streak.doneToday()) return;
      const n = Streak.count();
      this.show('🔥 Tu racha te espera', n ? 'Una lección rápida y salvas tus ' + plural(n, 'día', 'días') + '.' : 'Empieza hoy una racha nueva: solo 3 minutos.');
      toast('🔥 Es tu hora de practicar: ¡una lección y racha salvada!', 5000);
      if (typeof render === 'function') render();
    }, Math.min(ms, 2147483000));
  },
  syncState() {
    try { if (navigator.setAppBadge) { if (Streak.doneToday()) navigator.clearAppBadge(); else navigator.setAppBadge(1); } } catch (e) {}
    if (!this.hosted() || !('indexedDB' in window)) return;
    const st = { day: dayKey(), done: Streak.doneToday(), streak: Streak.count(), name: P.profile.name || '', lang: P.profile.active, at: Date.now() };
    try {
      const rq = indexedDB.open('parla-sw', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => { try { const tx = rq.result.transaction('kv', 'readwrite'); tx.objectStore('kv').put(st, 'state'); } catch (e) {} };
    } catch (e) {}
  },
  /* Evento diario de calendario con dos alarmas. */
  ics() {
    const r = P.profile.reminder || { time: '20:30' }; const p = r.time.split(':').map(Number);
    const d = new Date(); const pad = (n) => String(n).padStart(2, '0');
    const start = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(p[0]) + pad(p[1]) + '00';
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const late = p[0] * 60 + p[1] <= 21 * 60 + 30;
    const url = this.link();
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Parla//Racha//ES', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
      'UID:parla-racha-' + Date.now() + '@parla', 'DTSTAMP:' + stamp, 'DTSTART:' + start, 'DURATION:PT10M', 'RRULE:FREQ=DAILY',
      'SUMMARY:🔥 Parla: mantén tu racha', 'DESCRIPTION:Una lección de 3 minutos y tu racha sigue viva.' + (url ? '\\n' + url : ''), url ? 'URL:' + url : '',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:🔥 ¡No pierdas tu racha en Parla!', 'TRIGGER:PT0M', 'END:VALARM',
      late ? 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:⏰ Última llamada: tu racha acaba a medianoche\r\nTRIGGER:PT2H\r\nEND:VALARM' : '',
      'END:VEVENT', 'END:VCALENDAR'].filter(Boolean);
    return lines.join('\r\n');
  },
  downloadIcs() {
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([this.ics()], { type: 'text/calendar' }));
      a.download = 'parla-racha.ics'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      return true;
    } catch (e) { return false; }
  },
  /* ---- push con servidor (GitHub Actions) ---- */
  pushReady() { return !!(this.hosted() && this.reg && 'PushManager' in window && this.cfg && this.cfg.vapidPublicKey); },
  async subscribe() {
    const perm = await this.request(); if (perm !== 'granted') throw { code: 'denied' };
    const key = this.cfg.vapidPublicKey.replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(key + '==='.slice((key.length + 3) % 4)); const u8 = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
    let sub = await this.reg.pushManager.getSubscription();
    if (!sub) sub = await this.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8 });
    const j = sub.toJSON();
    return { name: P.profile.name || '', endpoint: j.endpoint, keys: j.keys, time: (P.profile.reminder || {}).time || '20:30', tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Madrid' };
  },
  async genKeys() {
    const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
    const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
    const b = (s) => s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const dec = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); const r = atob(s + '==='.slice((s.length + 3) % 4)); return Array.from(r, (c) => c.charCodeAt(0)); };
    const pub = [4].concat(dec(jwk.x), dec(jwk.y));
    return { publicKey: b(btoa(String.fromCharCode.apply(null, pub))), privateKey: b(jwk.d) };
  },
};

/* ============ Parla · lecciones ============ */
function tutorSystem(lang) {
  const L = LANGS[lang], pr = P.profile;
  return 'Eres ' + L.persona.name + ', tutor/a de ' + L.es + ' en Parla, una app tipo Duolingo. ' + L.persona.bio +
    ' Hablas al alumno de tú, en castellano de España salvo cuando practicáis en ' + L.es + '. Eres ' + ((pr.prefs || {}).tone === 'serio' ? 'claro y preciso' : 'cercano, motivador y con algo de humor') + '. ' +
    'Usa lo que recuerdas del alumno para personalizar ejemplos y para insistir en sus puntos débiles, sin mencionar que tienes una ficha.\n\nFicha del alumno:\n' + Memory.context(lang);
}

function startUnitLesson(ui, li) {
  const lang = P.profile.active, C = P.courseData(), c = P.course(), u = C.units[ui], l = Course.lessons(u)[li];
  const newIds = new Set(l.words.concat(l.sents).filter((it) => !SRS.get(c, it.id)).map((it) => it.id));
  const prevIds = C.units.slice(0, ui).flatMap((x) => x.words.concat(x.sents)).map((x) => x.id);
  const due = SRS.due(c, prevIds).slice(0, 2);
  const weak = SRS.weak(c, Object.keys(c.srs || {})).filter((id) => C.byId[id] && newIds.has(id) === false).slice(0, 2);
  const extra = uniq(due.concat(weak)).map((id) => C.byId[id]).filter(Boolean);
  const gram = Gram.forUnit(lang, u, l.review ? 3 : 2, P.profile.level);
  Lesson.start({ kind: l.review ? 'review' : 'unit', lang, course: C, words: l.words, sents: l.sents, extra, newIds, unit: u, li, gram, title: u.t + ' · ' + l.label });
}
function learnedItems(C, c) { return C.units.filter((u) => !u.pending).flatMap((u) => u.words.concat(u.sents)).filter((it) => SRS.get(c, it.id)); }
function startReview(only) {
  const lang = P.profile.active, C = P.courseData(), c = P.course();
  const seen = learnedItems(C, c).concat(Object.values(c.custom || {}).filter((x) => SRS.get(c, x.id)));
  if (seen.length < 4) { toast('Haz alguna lección antes: el repaso usa lo que ya has visto.'); return; }
  const get = (id) => C.byId[id] || (c.custom || {})[id];
  const ids = seen.map((x) => x.id);
  const pool = uniq(SRS.due(c, ids).concat(SRS.weak(c, ids)).concat(shuffle(ids.slice()))).slice(0, 12).map(get).filter(Boolean);
  Lesson.start({ kind: 'practice', lang, course: C, words: pool.filter((x) => x.k === 'w'), sents: pool.filter((x) => x.k === 's'), newIds: new Set(), only, title: only === 'listen' ? 'Escucha' : only === 'speak' ? 'Habla' : 'Repaso inteligente' });
}
function startWeak() {
  const lang = P.profile.active, C = P.courseData(), c = P.course();
  const ids = uniq(Memory.recent(lang, 40).reverse().map((x) => x.id).concat(SRS.weak(c, Object.keys(c.srs || {})))).filter((id) => C.byId[id]).slice(0, 10);
  if (ids.length < 3) { toast('Aún no hay fallos que repasar. ¡Bien hecho!'); return; }
  const items = ids.map((id) => C.byId[id]);
  Lesson.start({ kind: 'practice', lang, course: C, words: items.filter((x) => x.k === 'w'), sents: items.filter((x) => x.k === 's'), newIds: new Set(), title: 'Tus fallos' });
}
ACT['practice-weak'] = () => startWeak();

const Lesson = {
  st: null,
  start(spec) {
    const pr = P.profile;
    spec.level = spec.level || pr.level; spec.prefs = (pr.prefs && pr.prefs.styles) || [];
    spec.custom = P.course(spec.lang).custom || {};
    let ex = spec.exercises || buildLesson(spec);
    if (spec.gram && spec.gram.length && !spec.exercises) {
      // la gramática de la unidad sustituye a los últimos ejercicios y se reparte por la lección
      ex = ex.slice(0, Math.max(4, ex.length - spec.gram.length));
      spec.gram.forEach((g) => { const from = Math.ceil(ex.length / 3); ex.splice(from + rand(ex.length - from + 1), 0, g); });
    }
    if (!ex.length) { toast('No hay ejercicios disponibles.'); return; }
    this.st = { spec, ex, i: 0, ok: 0, total: 0, combo: 0, maxCombo: 0, wrongRun: 0, lives: spec.level === 'experto' && spec.kind !== 'placement' ? 3 : 99, t0: Date.now(), retried: false, mistakes: [], cur: {}, answered: false, placeWrong: 0, results2: [] };
    Speech.rate = pr.rate || 0.95; Speech.prefs = pr.voices || {};
    this.render();
  },
  ex() { return this.st.ex[this.st.i]; },
  render() {
    const st = this.st, e = this.ex(), lvl = st.spec.level; st.cur = { sel: null, ans: [], typed: '', heard: '', score: 0 }; st.answered = false;
    const prog = st.i / st.ex.length;
    const top = '<div class="ov-top"><button class="icon-btn" data-act="ls-quit" aria-label="Salir">' + ic('close') + '</button><div class="ls-prog bar"><i style="width:' + (prog * 100) + '%"></i></div>' +
      (st.lives < 99 ? '<span class="lives">❤️ ' + st.lives + '</span>' : st.combo >= 3 ? '<span class="combo">🔥 ×' + st.combo + '</span>' : '') + '</div>';
    const timer = lvl === 'experto' && ['match', 'speak'].indexOf(e.type) < 0 && st.spec.kind !== 'placement' ? '<div class="timer"><i id="ls-timer" style="width:100%"></i></div>' : '';
    const root = openOverlay(top + timer + '<div class="ov-body" id="ls-body">' + this.body(e) + '</div><div class="ov-foot" id="ls-foot">' + this.foot(e) + '</div>');
    this.mount(root, e);
    if (timer) this.startTimer(25);
  },
  foot(e) {
    const skip = e.type === 'speak' || e.type === 'speakTr' ? '<button class="btn text" data-act="ls-nospeak">No puedo hablar ahora</button>' : (e.type === 'listen' || e.type === 'listenPick') ? '<button class="btn text" data-act="ls-nolisten">No puedo escuchar ahora</button>' : '';
    return (e.type === 'match' ? '' : '<button class="btn block" id="ls-check" data-act="ls-check" disabled>Comprobar</button>') + skip;
  },
  body(e) {
    const it = e.item, lang = this.st.spec.lang, sp = (t, cls) => '<button class="spk ' + (cls || '') + '" data-act="say" data-text="' + esc(t) + '" data-lang="' + lang + '"' + (cls === 'slow' ? ' data-slow="1"' : '') + ' aria-label="' + (cls === 'slow' ? 'Escuchar despacio' : 'Escuchar') + '">' + ic(cls === 'slow' ? 'turtle' : 'speaker', cls === 'xl' ? '' : '') + '</button>';
    const newTag = e.isNew ? '<span class="newword">' + ic('spark', 'sm') + ' Palabra nueva</span>' : '';
    const hints = this.st.spec.level === 'facil';

const Shadow = {
  st: null,
  open() {
    const lang = P.profile.active, C = P.courseData(), c = P.course();
    let pool = learnedItems(C, c).filter((x) => x.k === 's');
    if (pool.length < 5) { const cu = C.units[currentUnit(lang)]; pool = pool.concat(cu ? cu.sents : []); }
    if (!pool.length) { toast('Haz una lección primero'); return; }
    if (!Speech.hasVoice(lang)) { voiceHelp(); return; }
    this.st = { lang, list: pick(pool, Math.min(6, pool.length)), i: 0, good: 0 };
    this.render();
  },

/* ============ Parla · Practicar → Hablar ============

   modo sombra y conversación por voz con el tutor. Datos en SPEAK (05q-speaking.js).

const SPEAK_KINDS = [
  { id: 'questions', em: '🎙️', t: 'Responde en voz alta', d: 'Preguntas de tu nivel: contesta hablando y te corrijo.', n: 5 },
  { id: 'reading', em: '📖', t: 'Lee en voz alta', d: 'Textos cortos: marco en rojo lo que no se entiende.', n: 3 },

  { id: 'pairs', em: '👂', t: 'Pares mínimos', d: 'Distingue y pronuncia palabras que suenan casi igual.', n: 5 },

function speakSection(lang) {

    pTile('speak', '🗣️', 'Frases de tus lecciones', 'Lee y traduce en voz alta lo que ya has visto', '') +
    pTile('shadow', '🎧', 'Modo sombra', 'Repite a la vez que el audio: el método viral de pronunciación', 'Tendencia') +

}
ACT['p-voicechat'] = () => { P.profile.voiceChat = true; P.profile.chatVoice = true; P.save('profile'); go('chat'); toast('🎧 Modo voz activado: te leo cada respuesta' + (Speech.canListen() ? ' y luego te escucho' : '')); };

const SpeakAct = {
  st: null,
  parse(kind, s) {
    const f = s.split('|');
    if (kind === 'tongue') return { t: f[0], es: f[1], cefr: f[2] || 'B1', tip: f[3] || '' };
    if (kind === 'questions') return { q: f[0], es: f[1], cefr: f[2] || 'A1', model: f[3] || '', kw: (f[4] || '').split(';').map((x) => x.trim()).filter(Boolean) };
    if (kind === 'reading') return { t: f[0], es: f[1], cefr: f[2] || 'A1' };
    if (kind === 'scenes') return { em: f[0], es: f[1], cefr: f[2] || 'A1', kw: (f[3] || '').split(';').map((x) => x.trim()).filter(Boolean), model: f[4] || '' };
    if (kind === 'pairs') { const w = f[0].split(';'), m = (f[1] || '').split(';'); return { w, m, tip: f[2] || '' }; }
    return null;
  },
  open(kind) {
    const lang = P.profile.active, data = typeof SPEAK !== 'undefined' && SPEAK[lang] && SPEAK[lang][kind];
    if (!data || !data.length) { toast('Esta actividad aún no está disponible en este idioma'); return; }
    const K = SPEAK_KINDS.find((k) => k.id === kind), my = cefrIdx(userCefr(lang));
    let items = data.map((s) => this.parse(kind, s)).filter(Boolean);
    if (kind !== 'pairs') { const fit = items.filter((x) => cefrIdx(x.cefr) <= my + 1); if (fit.length >= K.n) items = fit; }
    // primero los de tu nivel, luego algo por encima
    items = shuffle(items).sort((a, b) => Math.abs(cefrIdx(a.cefr) - my) - Math.abs(cefrIdx(b.cefr) - my)).slice(0, K.n);
    this.st = { kind, K, lang, items: shuffle(items), i: 0, good: 0, res: [], t0: Date.now() };
    this.render();
  },
  render() {
    const st = this.st, it = st.items[st.i], lang = st.lang, live = Speech.canListen();
    st.cur = { heard: '', typed: '', alts: [], done: false, phase: 'listen' };
    const sp = (t, slow) => '<button class="spk' + (slow ? ' slow' : '') + '" data-act="say" data-text="' + esc(t) + '"' + (slow ? ' data-slow="1"' : '') + ' aria-label="Escuchar">' + ic(slow ? 'turtle' : 'speaker') + '</button>';
    let body = '';
    if (st.kind === 'questions') body = '<div class="row wrap"><span class="tag">' + it.cefr + '</span></div><h2 class="prompt-title">Responde hablando</h2><div class="say">' + sp(it.q) + '<div class="txt">' + esc(it.q) + '<div class="small muted" style="margin-top:4px">' + esc(it.es) + '</div></div></div>' + saInput(lang, live, 'Pulsa y contesta con una frase completa');
    else if (st.kind === 'reading') body = '<div class="row wrap"><span class="tag">' + it.cefr + '</span></div><h2 class="prompt-title">Lee en voz alta</h2><div class="row" style="gap:10px">' + sp(it.t) + sp(it.t, true) + '</div><div class="card"><p style="font-size:19px;line-height:1.55" id="sa-text">' + esc(it.t) + '</p><p class="small muted mt">' + esc(it.es) + '</p></div>' + saInput(lang, live, 'Pulsa y lee el texto');
    else if (st.kind === 'tongue') body = '<h2 class="prompt-title">Trabalenguas</h2><div class="row" style="gap:10px">' + sp(it.t) + sp(it.t, true) + '</div><div class="card"><p style="font-size:21px;font-weight:650;line-height:1.5" id="sa-text">' + esc(it.t) + '</p><p class="small muted mt">' + esc(it.es) + '</p>' + (it.tip ? '<p class="small fg2 mt">👅 ' + esc(it.tip) + '</p>' : '') + '</div>' + saInput(lang, live, 'Escúchalo, y luego dilo de un tirón');
    else if (st.kind === 'scenes') body = '<div class="row wrap"><span class="tag">' + it.cefr + '</span></div><h2 class="prompt-title">Describe la escena</h2><div class="emoji-xl" style="font-size:56px;letter-spacing:6px">' + esc(it.em) + '</div><p class="center muted small">Di 1 o 2 frases sobre lo que ves.</p>' + (P.profile.level === 'facil' && it.kw.length ? '<p class="center small">Pistas: ' + it.kw.slice(0, 3).map(esc).join(' · ') + '</p>' : '') + saInput(lang, live, 'Pulsa y describe la escena');

  const C = P.courseData(lang), c = P.course(lang);
  let pool = C.units.filter((u) => !u.pending).flatMap((u) => u.words).filter((w) => SRS.get(c, w.id));
  const cu = C.units[currentUnit(lang)]; if (pool.length < n && cu) pool = uniq(pool.concat(cu.words));
  if (pool.length < n) pool = uniq(pool.concat(C.units.filter((u) => !u.pending).slice(0, 3).flatMap((u) => u.words)));

const KB_ROWS = ['qwertyuiop', 'asdfghjkl', '⏎zxcvbnm⌫'];

    const idx = free ? rand(list.length) : Math.floor(seeded(today + lang)() * list.length);

    Games.cur = { kind: 'wordle', lang, free: !!free, idx: saved ? saved.idx : idx, word: f[0], es: f[1], target: baseWord(f[0]), rows: saved ? saved.rows.slice() : [], cur: '', done: saved ? saved.done : false, won: saved ? saved.won : false };
    this.render();
  },
  score(guess, target) {

    g.forEach((ch, i) => { if (res[i] !== 'ok') { const k = t.indexOf(ch); if (k >= 0) { res[i] = 'near'; t[k] = null; } } });

  },

    let grid = '';

  Rush.tick(); if (g.left <= 0) { clearInterval(Games.tm); Rush.finish(); return; }
  Rush.next();
};

/* ============ Parla · charla con el tutor ============
   El tutor responde en el idioma que aprendes, corrige tus mensajes, traduce si lo pides y guarda
   palabras nuevas en tu repaso. Lo que aprende de ti pasa a su memoria. */
const Chat = {
  busy: false, ctl: null,
  key(lang) { return 'chat_' + lang; },
  async load(lang) { let d = await Store.load(this.key(lang)); if (!d) { d = { msgs: [], scen: null, mode: 'libre', n: 0 }; Store.save(this.key(lang), d); } return d; },
  doc(lang) { return Store.get(this.key(lang || P.profile.active)); },
  save(lang) { const d = this.doc(lang); if (d.msgs.length > 60) d.msgs = d.msgs.slice(-60); Store.save(this.key(lang || P.profile.active), d); },
  system(lang, d) {
    const L = LANGS[lang], C = P.courseData(lang), cu = C.units[currentUnit(lang)], cefr = cu ? cu.cefr : 'A1';
    const scen = d.scen ? (L.scen || []).find((s) => s.id === d.scen) : null;
    const mode = d.mode || 'libre';
    let s = tutorSystem(lang) + '\n\n';
    if (mode === 'tutor') {
      s += 'Ahora haces de profesor particular: el alumno te pregunta dudas en castellano. Responde en castellano, claro y breve (máx. 120 palabras), con ejemplos en ' + L.es + '. Si escribe en ' + L.es + ', corrígele.\nFormato: tu respuesta y, si el alumno cometió errores en ' + L.es + ', una línea final que empiece por ">>CORR:" con la versión corregida.';
      return s;
    }
    s += 'Estáis conversando en ' + L.es + '. Nivel del alumno: ' + cefr + '. Usa frases cortas y vocabulario de su nivel, con alguna palabra nueva útil. Haz siempre una pregunta para que la conversación siga. Saca temas de sus intereses cuando encaje.\n';
    if (scen) s += 'Roleplay: ' + scen.d + ' Mantente en tu papel.\n';
    if (mode === 'estricto') s += 'Corrige TODOS los errores del alumno, incluso los pequeños (tildes, artículos, orden).\n';
    if (mode === 'diario') s += 'Hoy toca diario: pide al alumno que te cuente su día en tres frases, corrígelas con cariño y comenta algo de lo que cuente.\n';
    s += '\nFormato obligatorio de cada respuesta:\n1) Tu mensaje en ' + L.es + ' (1 a 3 frases).\n' +
      '2) Si el último mensaje del alumno tenía errores, una línea que empiece por ">>CORR:" con la frase corregida y una explicación de 10 palabras como máximo en castellano. Si no tenía errores, no pongas esta línea.\n' +
      '3) Una línea que empiece por ">>TRAD:" con la traducción al castellano de tu mensaje.\n' +
      '4) Opcional: una línea ">>VOCAB:" con 1 o 2 palabras nuevas de tu mensaje, formato "palabra = traducción; palabra = traducción".\nNo uses markdown.';
    return s;
  },
  parse(raw) {
    const out = { main: '', corr: '', trad: '', vocab: [] };
    const lines = String(raw || '').split('\n'); const main = [];
    lines.forEach((l) => {
      const m = /^\s*>>\s*(CORR|TRAD|VOCAB)\s*:\s*(.*)$/i.exec(l);
      if (m) { const k = m[1].toUpperCase(); if (k === 'CORR') out.corr = m[2].trim(); else if (k === 'TRAD') out.trad = m[2].trim(); else out.vocab = m[2].split(';').map((x) => x.split('=').map((y) => y.trim())).filter((x) => x.length === 2 && x[0] && x[1]).slice(0, 3); }
      else if (!/^\s*>>/.test(l)) main.push(l);
    });
    out.main = main.join('\n').trim();
    return out;
  },
  async send(text, o) {
    o = o || {};
    const lang = P.profile.active, d = this.doc(lang); if (this.busy) return;
    if (!AI.ok()) { toast(AI.msg({ code: 'no_ai' }), 4500); return; }
    if (text) d.msgs.push({ r: 'u', t: text, hidden: !!o.hidden });
    this.busy = true; this.save(lang); renderChatMsgs(true);
    const hist = d.msgs.slice(-18).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.r === 'u' ? m.t : m.t + (m.trad ? '' : '') }));
    this.ctl = new AbortController();
    const bubble = $('#chat-live');
    try {
      const raw = await AI.text({ system: this.system(lang, d), messages: hist, signal: this.ctl.signal, onText: (t) => { const b = $('#chat-live'); if (b) b.textContent = this.parse(t).main || '…'; scrollChat(); } });
      const p = this.parse(raw);
      d.msgs.push({ r: 'a', t: p.main || raw.trim(), trad: p.trad, corr: p.corr });
      markAiOk();
      // corrección → memoria de fallos
      if (p.corr && text && !o.hidden) {
        const m = P.memory; m.mistakes.push({ t: Date.now(), lang, id: '', ex: 'chat', q: '', exp: p.corr.slice(0, 160), got: text.slice(0, 120), err: 'grammar' });
        m.tags[lang] = m.tags[lang] || {}; m.tags[lang].grammar = (m.tags[lang].grammar || 0) + 0.5; P.save('memory');
      }
      // vocabulario nuevo → repaso
      if (p.vocab.length) {
        const c = P.course(lang); c.custom = c.custom || {}; c.srs = c.srs || {}; let added = 0;
        p.vocab.forEach((v) => { const id = lang + ':chat:' + hash(v[0]).toString(36); if (!c.custom[id]) { c.custom[id] = { id, k: 'w', t: v[0], alt: [], es: v[1], altEs: [], em: '💬', unit: 'chat' }; c.srs[id] = [1, dayNum(), 0, 0, dayNum()]; added++; } });
        if (added) { P.saveCourse(lang); d.msgs[d.msgs.length - 1].vocab = p.vocab; }
      }
      if (text && !o.hidden) {
        d.n = (d.n || 0) + 1; P.stats.chat = (P.stats.chat || 0) + 1; Quests.bump('chat', 1);
        const st = P.stats; st.chatDay = st.chatDay && st.chatDay.day === dayKey() ? st.chatDay : { day: dayKey(), xp: 0 };
        if (st.chatDay.xp < 15) { st.chatDay.xp += 1; const r = Streak.addXP(1, 'chat'); if (r.extended) { Sound.play('streak'); toast('🔥 ¡Racha ampliada charlando! ' + r.streak + ' días', 3500); renderTop(); renderTabbar(); } }
        P.save('stats');
        if (d.n % 6 === 0) Memory.consolidate(lang, d.msgs.filter((m) => m.r === 'u' && !m.hidden).slice(-8).map((m) => 'Alumno: ' + m.t).join('\n'));
      }
      if (P.profile.chatVoice || P.profile.voiceChat) Speech.speak(p.main, lang).then(() => { if (P.profile.voiceChat && App.tab === 'chat' && !$('#overlay').innerHTML) setTimeout(chatAutoListen, 250); });
    } catch (e) {
      const msg = AI.msg(e); if (msg) toast(msg, 4500);
      if (text && e && e.code !== 'cancelled') { /* deja el mensaje para reintentar */ }
    }
    this.busy = false; this.ctl = null; this.save(lang); renderChatMsgs(); renderTop();
  },
};

  h += '<section class="card"><h3>Tus cursos</h3><div class="list mt">' + langs.map((l) => {
    const c = P.course(l); if (!c) return '';
    const C = Course.get(l, c.gen), tot = C.units.length * 4; let done = 0; C.units.forEach((u) => { for (let i = 0; i < 4; i++) if (lessonDone(c, u, i)) done++; });

  v.innerHTML = h;

function xpChart() {
  const d = Streak.last7(), goal = P.profile.goal || 20, max = Math.max(goal, ...d.map((x) => x.xp)) * 1.15;
  const W = 320, H = 150, pad = 22, bw = 30, gap = (W - 2 * pad - 7 * bw) / 6;
  const y = (v) => H - 24 - ((H - 44) * v) / max;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="XP de los últimos 7 días">';
  s += '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y(goal) + '" y2="' + y(goal) + '" stroke="var(--line-2)" stroke-dasharray="4 4"/><text x="' + (W - pad) + '" y="' + (y(goal) - 4) + '" text-anchor="end" font-size="10" fill="var(--fg-3)">meta ' + goal + '</text>';
  d.forEach((x, i) => {
    const X = pad + i * (bw + gap), top = y(x.xp), hh = H - 24 - top;
    s += '<rect x="' + X + '" y="' + top + '" width="' + bw + '" height="' + Math.max(hh, x.xp ? 3 : 0) + '" rx="7" fill="' + (x.xp >= goal ? 'var(--accent)' : x.xp ? 'var(--accent-lo)' : 'var(--surface-3)') + '"/>';
    if (x.xp) s += '<text x="' + (X + bw / 2) + '" y="' + (top - 5) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--fg-2)">' + x.xp + '</text>';
    s += '<text x="' + (X + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" font-weight="' + (i === 6 ? 800 : 600) + '" fill="' + (i === 6 ? 'var(--accent-hi)' : 'var(--fg-3)') + '">' + (x.ice ? '🧊' : DOW[dowIdx(x.k)]) + '</text>';
  });
  return s + '</svg>';
}
function monthCal() {

    if (Notify.pushReady()) h += '<div class="card accent"><h3>🚀 Avisos push</h3><p class="small fg2 mt">Avisos aunque no abras la app, enviados cada día a tu hora. Si ya practicaste, te felicita en vez de avisarte.</p><button class="btn block mt" data-act="rem-push">Activar avisos push</button><div id="push-out"></div></div>';
    else h += '<details class="card flat small"><summary><b>Avisos push (avanzado)</b></summary><p class="fg2 mt">Para recibir avisos aunque no abras la app hace falta un pequeño envío diario desde GitHub Actions. Los pasos están en el README del repositorio. Genera aquí tus claves:</p><button class="btn sm ghost mt" data-act="rem-keys">Generar claves</button><div id="keys-out"></div></details>';
  } else {

      '<button class="btn ghost block mt" data-act="rem-copy">Copiar texto del recordatorio</button></div>' +
      '<div class="card flat small fg2">También puedes pedirle a Siri: «Recuérdame todos los días a las ' + esc(r.time.replace(':', ' y ')) + ' practicar en Parla».</div>';

ACT['rem-ics'] = () => { if (Notify.downloadIcs()) toast('Abre el archivo y pulsa «Añadir todo»'); else toast('No se ha podido crear el evento'); };
ACT['rem-notif'] = async () => { const p = await Notify.request(); toast(p === 'granted' ? 'Notificaciones activadas' : 'Sin permiso para notificaciones'); if (p === 'granted') { Notify.syncState(); Notify.show('🔥 ¡Así te avisaré!', 'Racha actual: ' + Streak.count() + ' días.'); } ACT.reminders(); };
ACT['rem-copy'] = () => copyText('🔥 Parla: mantén tu racha' + (Notify.link() ? ' · ' + Notify.link() : ''));

};

ACT['copy-priv'] = () => copyText(App.keys.privateKey);

/* ---------- bienvenida ---------- */
const Onb = {
  st: null, steps: 7,
  start() { this.st = { step: 0, name: '', lang: 'ca', start: 'zero', styles: [], interests: [], motive: [], explain: 'breve', tone: 'divertido', goal: 20, level: 'normal', time: '20:30' }; this.render(); },
  render() {
    const s = this.st, n = s.step; let h = '';
    const dots = n ? '<div class="steps">' + Array.from({ length: this.steps }, (_, i) => '<i class="' + (i < n ? 'on' : '') + '"></i>').join('') + '</div>' : '';
    if (n === 0) h = '<div class="onb" style="padding-top:6vh"><div class="logo">Parla</div><h1>Aprende catalán, alemán y más, un poco cada día.</h1><p class="fg2">Lecciones de 3 minutos, juegos, voz y un tutor con IA que recuerda tus fallos y tus gustos. Tu racha te espera.</p><div class="row wrap">' + flag('ca', 'lg') + flag('de', 'lg') + flag('en', 'lg') + flag('fr', 'lg') + flag('it', 'lg') + flag('pt', 'lg') + '</div>' +
      '<button class="btn ghost block" data-act="progress-restore">Ya usaba Parla: recuperar mi progreso</button></div>';
    else if (n === 1) h = '<div class="onb"><h2>¿Cómo te llamas?</h2><p class="fg2">Así te hablará tu tutor.</p><input class="input" id="onb-name" maxlength="30" autocomplete="given-name" placeholder="Tu nombre" value="' + esc(s.name) + '"></div>';
    else if (n === 2) h = '<div class="onb"><h2>¿Qué quieres aprender?</h2><div class="stack tight">' + ['ca', 'de', 'en', 'fr', 'it', 'pt'].map((l) => '<button class="lang-card" data-act="onb-lang" data-l="' + l + '" aria-pressed="' + (s.lang === l) + '">' + flag(l, 'lg') + '<div class="grow"><div class="nm">' + esc(LANGS[l].name) + '</div><div class="small muted">' + (LANGS[l].ai ? 'Curso generado por el tutor IA' : 'Curso completo para hispanohablantes') + '</div></div>' + (LANGS[l].ai ? '<span class="tag">IA</span>' : '') + '</button>').join('') + '</div><p class="small muted">Podrás añadir más idiomas cuando quieras.</p></div>';
    else if (n === 3) h = '<div class="onb"><h2>¿Cuánto sabes de ' + esc(LANGS[s.lang].es) + '?</h2><div class="stack tight">' + [['zero', '🌱', 'Empiezo de cero'], ['some', '🌿', 'Sé algunas cosas', 'Hago una prueba de nivel de 2 minutos'], ['good', '🌳', 'Me defiendo bien', 'Prueba de nivel y salto hasta donde llegues']].map((x) => '<button class="lang-card" data-act="onb-start" data-v="' + x[0] + '" aria-pressed="' + (s.start === x[0]) + '"><span style="font-size:30px">' + x[1] + '</span><div class="grow"><div class="nm">' + x[2] + '</div>' + (x[3] ? '<div class="small muted">' + x[3] + '</div>' : '') + '</div></button>').join('') + '</div></div>';
    else if (n === 4) h = '<div class="onb"><h2>Cuéntame de ti</h2><p class="fg2">Tu tutor usará tus intereses en las frases y en la charla.</p><p class="eyebrow">¿Para qué lo aprendes?</p>' + chips('motive', MOTIVES, s.motive) + '<p class="eyebrow">Te interesa…</p>' + chips('interests', INTERESTS, s.interests) + '</div>';
    else if (n === 5) h = '<div class="onb"><h2>¿Cómo aprendes mejor?</h2><p class="fg2">Elige todo lo que te guste: las lecciones meterán más de eso.</p>' + chips('styles', STYLES, s.styles) + '<p class="eyebrow">Explicaciones</p>' + seg('explain', [['breve', 'Breves'], ['detallada', 'Detalladas']], s.explain) + '<p class="eyebrow">Tono del tutor</p>' + seg('tone', [['divertido', '😄 Con humor'], ['serio', '🎓 Serio']], s.tone) + '</div>';
    else if (n === 6) h = '<div class="onb"><h2>Tu meta diaria</h2>' + seg('goal', [[10, 'Casual<br><span class="small muted">5 min</span>'], [20, 'Normal<br><span class="small muted">10 min</span>'], [30, 'Serio<br><span class="small muted">15 min</span>'], [50, 'Intenso<br><span class="small muted">25 min</span>']], s.goal) + '<p class="eyebrow">Dificultad</p>' + seg('level', LEVEL_ORDER.map((k) => [k, LEVELS[k].name]), s.level) + '<p class="small muted" id="lvl-d">' + esc(LEVELS[s.level].d) + ' Se ajusta sola según tus resultados.</p></div>';
    else if (n === 7) h = '<div class="onb"><h2>¿A qué hora te recuerdo la racha?</h2><p class="fg2">Elige un momento en el que suelas tener 5 minutos libres.</p><input class="input" type="time" id="onb-time" value="' + esc(s.time) + '"><div class="card flat small fg2">' + flameSvg('on') + ' Cada día que completes una lección, tu racha sube. Si un día fallas, un <b>protector</b> 🧊 la salva. Empiezas con uno.</div></div>';
    const root = openOverlay('<div class="ov-top">' + (n ? '<button class="icon-btn" data-act="onb-back" aria-label="Atrás">' + ic('back') + '</button>' : '') + '<div class="grow">' + dots + '</div></div><div class="ov-body">' + h + '</div><div class="ov-foot"><button class="btn block" data-act="onb-next">' + (n === 0 ? 'Empezar' : n === 7 ? '¡A por la primera lección!' : 'Continuar') + '</button></div>');
    const nm = $('#onb-name', root); if (nm) { setTimeout(() => nm.focus(), 250); nm.onkeydown = (e) => { if (e.key === 'Enter') ACT['onb-next'](); }; }
  },
  collect() {
    const s = this.st, r = $('#overlay');
    if (s.step === 1) s.name = ($('#onb-name', r).value || '').trim();
    if (s.step === 4) { s.motive = readChips(r, 'motive'); s.interests = readChips(r, 'interests'); }
    if (s.step === 5) { s.styles = readChips(r, 'styles'); s.explain = readSeg(r, 'explain') || 'breve'; s.tone = readSeg(r, 'tone') || 'divertido'; }
    if (s.step === 6) { s.goal = +(readSeg(r, 'goal') || 20); s.level = readSeg(r, 'level') || 'normal'; }
    if (s.step === 7) s.time = $('#onb-time', r).value || '20:30';
  },
  async finish() {
    const s = this.st, pr = P.profile;
    Object.assign(pr, { name: s.name, active: s.lang, goal: s.goal, level: s.level, onboarded: true, reminder: { time: s.time, on: true } });
    pr.prefs = { styles: s.styles, interests: s.interests, motive: s.motive, explain: s.explain, tone: s.tone };
    pr.langs[s.lang] = { started: dayKey() };
    P.save('profile'); await P.loadCourse(s.lang); Notify.schedule(); Board.sync();
    this.st = null; closeOverlay();
    if (LANGS[s.lang].ai) { ACT['next-lesson'](); return; }
    if (s.start !== 'zero') startPlacement(s.lang); else startUnitLesson(0, 0);
  },
};
ACT['onb-next'] = () => {
  const s = Onb.st; Onb.collect();
  if (s.step === 1 && !s.name) { toast('Escribe tu nombre (o un apodo)'); return; }
  if (s.step === 2 && LANGS[s.lang].ai && !AI.ok()) { toast(AI.msg({ code: 'no_ai' }), 5000); return; }
  if (s.step === 2 && LANGS[s.lang].ai) s.step++; // sin prueba de nivel en cursos IA
  if (s.step >= 7) { Onb.finish(); return; }
  s.step++; Onb.render();
};
ACT['onb-back'] = () => { const s = Onb.st; Onb.collect(); s.step = Math.max(0, s.step - 1); Onb.render(); };
ACT['onb-lang'] = (a) => { Onb.st.lang = a.dataset.l; $$('[data-act="onb-lang"]').forEach((b) => b.setAttribute('aria-pressed', b === a)); Sound.play('tap'); };
ACT['onb-start'] = (a) => { Onb.st.start = a.dataset.v; $$('[data-act="onb-start"]').forEach((b) => b.setAttribute('aria-pressed', b === a)); Sound.play('tap'); };

// ---- 18-ui-guest.js ----
/* ============ Parla · progreso de quien entra sin permiso para guardar ============
   Quien abre Parla con el enlace público (y no pertenece a la cuenta del propietario) no puede escribir
   en la base de datos del artefacto. Su progreso se guarda en el navegador, pero en iPhone Safari lo
   borra al cerrarse. Para no empezar de cero: código de progreso (copiar/pegar) o archivo de copia. */
function guestMode() { return Store.inClaude && Store.mode !== 'cloud'; }
function onReadOnly() { if (App.booted) render(); }
function guestBanner() {
  if (!guestMode()) return '';
  const eph = Store.ephemeral();
  if (!Store.changedSinceBackup && App.guestSaved) return '<div class="card flat small fg2">💾 Progreso guardado en tu código. Si cierras Safari, recupéralo con «Recuperar progreso».</div>';
  return '<div class="card warn"><h3>💾 Guarda tu progreso</h3><p class="small fg2" style="margin-top:4px">' +
    (eph ? 'Entras con el enlace público: Claude no deja guardar tu progreso en la nube y Safari lo borra al cerrarse. ' : 'Entras con el enlace público: tu progreso solo se guarda en este navegador. ') +
    'Copia tu código de progreso antes de salir (por ejemplo, en Notas) y recupéralo la próxima vez.</p>' +
    '<div class="row wrap mt"><button class="btn sm" data-act="progress-save">Copiar mi código</button><button class="btn sm ghost" data-act="progress-restore">Recuperar progreso</button></div>' +
    '<button class="btn text" style="padding:0;min-height:32px" data-act="progress-why">¿Cómo lo guardo siempre?</button></div>';
}
ACT['progress-save'] = async () => {
  let code = '';
  try { code = await Store.packCode(); } catch (e) { toast('No se ha podido crear el código.'); return; }
  App.guestCode = code; App.guestSaved = true;
  const copied = await copyText(code);
  openSheet('<h2>💾 Tu código de progreso</h2><p class="fg2">' + (copied ? 'Ya está copiado. ' : '') + 'Pégalo en Notas o mándatelo por WhatsApp. La próxima vez, en «Recuperar progreso», pégalo y seguirás donde lo dejaste: racha, curso, memoria del tutor…</p>' +
    '<textarea class="input small" readonly rows="4" id="code-out">' + esc(code) + '</textarea>' +
    '<button class="btn block" data-act="progress-copy">Copiar otra vez</button>' +
    '<button class="btn ghost block" data-act="export">Guardar como archivo</button>' +
    '<p class="small muted">Código de ' + Math.round(code.length / 1024) + ' KB. Cada vez que avances, guarda uno nuevo.</p>');
  if (App.tab === 'learn') render();
};
ACT['progress-copy'] = () => copyText(App.guestCode || '');
ACT['progress-restore'] = () => {
  openSheet('<h2>Recuperar progreso</h2><p class="fg2">Pega tu código de progreso (empieza por «PARLA») o elige el archivo de copia.</p>' +
    '<textarea class="input small" rows="5" id="code-in" placeholder="PARLA2.…" autocomplete="off" spellcheck="false"></textarea>' +
    '<button class="btn block" data-act="progress-apply">Recuperar</button>' +
    '<label class="btn ghost block" for="code-file" style="cursor:pointer">Elegir archivo de copia</label><input type="file" id="code-file" accept="application/json,.json" hidden>', (el) => {
    const f = $('#code-file', el); f.onchange = () => importFile(f.files[0]);
  });
};
ACT['progress-apply'] = async () => {
  const v = ($('#code-in') || {}).value || '';
  try {
    const o = await Store.unpackCode(v);
    if (!o || o.app !== 'parla') throw new Error('formato');
    await Store.importAll(o);
    toast('Progreso recuperado ✨'); setTimeout(() => location.reload(), 500);
  } catch (e) { toast('Ese código no es válido. Cópialo entero, desde «PARLA» hasta el final.', 4500); }
};
ACT['progress-why'] = () => {
  openSheet('<h2>¿Por qué no se guarda solo?</h2><p class="fg2">Parla es un artefacto privado de Claude. Solo pueden guardar en la nube quien lo creó y las personas que invita por correo con permiso <b>Editor</b> mientras el enlace público está desactivado.</p>' +
    '<div class="card flat small fg2"><b>Para guardar siempre:</b> pide a quien te pasó Parla que, en el botón <b>Compartir</b> del artefacto, desactive el enlace público y te invite con tu correo como <b>Editor</b>. Después entra con tu cuenta de Claude: tu progreso, tu racha y la liga de amigos se guardarán solos.</div>' +
    '<div class="card flat small fg2"><b>Mientras tanto:</b> antes de cerrar, toca «Copiar mi código» y guárdalo. Al volver, «Recuperar progreso».</div>');
};

// ---- 99-boot.js ----
/* ============ Parla · arranque ============ */
async function boot() {
  $('#view').innerHTML = '<div class="onb center" style="padding-top:22vh"><div class="logo">Parla</div><p class="muted">Cargando tu progreso…</p></div>';
  Speech.init();
  await Promise.all([Store.init(), AI.init()]);
  await Promise.all(DOCS.map((n) => Store.load(n)));
  if (Store.mode === 'cloud' && Store.loadFailed.size) {
    // la nube no ha respondido: no se crean datos vacíos que pisarían tu progreso
    $('#view').innerHTML = '<div class="card" style="margin-top:20vh"><h3>No he podido cargar tu progreso</h3><p class="small fg2 mt">La conexión con Claude ha fallado. Tu progreso sigue guardado; vuelve a intentarlo.</p><button class="btn block mt" onclick="location.reload()">Reintentar</button></div>';
    return;
  }
  if (!Store.get('profile')) Store.save('profile', defaultProfile());
  if (!Store.get('streak')) Store.save('streak', defaultStreak());
  if (!Store.get('stats')) Store.save('stats', defaultStats());
  if (!Store.get('memory')) Store.save('memory', defaultMemory());
  const pr = P.profile;
  // campos nuevos en perfiles antiguos
  const d = defaultProfile(); Object.keys(d).forEach((k) => { if (pr[k] === undefined) pr[k] = d[k]; });
  if (!LANGS[pr.active]) pr.active = 'ca';
  // si ya hay progreso, nunca se vuelve a pedir la bienvenida
  if (!pr.onboarded && ((P.stats && P.stats.xp > 0) || Object.keys((P.streak && P.streak.days) || {}).length || Object.keys(pr.langs || {}).length)) { pr.onboarded = true; P.save('profile'); }
  if (!pr.name && Store.user) { try { const n = await Store.user.name(); if (n) Onb.prefill = n.split(' ')[0]; } catch (e) {} }
  applyTheme(); Sound.on = pr.sound !== false; Speech.rate = pr.rate || 0.95; Speech.prefs = pr.voices || {};
  await Promise.all(uniq([pr.active].concat(Object.keys(pr.langs || {}))).map((l) => P.loadCourse(l)));
  App.events = Streak.reconcile();
  Quests.ensure();
  App.booted = true; App.day = dayKey();
  render();
  Notify.init();
  if (!pr.onboarded) { Onb.start(); if (Onb.prefill) Onb.st.name = Onb.prefill; }
  else if (App.events.some((e) => e.type === 'frozen')) Sound.play('ok');
}
// cambio de día con la app abierta y vuelta a primer plano
setInterval(() => { if (App.booted && App.day !== dayKey()) { App.day = dayKey(); App.events = Streak.reconcile(); Quests.ensure(); render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && App.booted) { if (App.day !== dayKey()) { App.day = dayKey(); App.events = Streak.reconcile(); Quests.ensure(); } if (!$('#overlay').innerHTML) render(); else { renderTop(); } Notify.syncState(); } });
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => applyTheme()); } catch (e) {}
boot().catch((e) => { console.error(e); $('#view').innerHTML = '<div class="card"><h3>No se ha podido arrancar Parla</h3><p class="small fg2">' + esc(e && e.message) + '</p><button class="btn mt" onclick="location.reload()">Reintentar</button></div>'; });

</script>

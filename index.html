<title>Parla</title>
<link rel="apple-touch-icon" sizes="1024x1024" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="1024x1024" href="apple-touch-icon.png">

    [['apple-touch-icon'], ['icon', 'image/png']].forEach(function (x) {
      h.querySelectorAll('link[rel="' + x[0] + '"]').forEach(function (l) { l.remove(); });
      var l = document.createElement('link'); l.rel = x[0]; l.href = url; l.setAttribute('sizes', '1024x1024'); if (x[1]) l.type = x[1]; h.appendChild(l);

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<style>
/* Parla · una columna de móvil (máx. 560px) sobre negro violáceo, como Enten.
   Camino de lecciones en zigzag, botones gruesos con sombra inferior, barra de pestañas fija abajo.
   Morado = marca y acciones; naranja = solo la racha; verde/rojo = acierto/fallo. */
:root{
  color-scheme:dark;
  --bg:#09070f;
  --surface:#14111c;
  --surface-2:#1b1726;
  --surface-3:#252033;
  --line:#2a2440;
  --line-2:#3b3354;
  --fg:#f0edf7;
  --fg-2:#c0b9d0;
  --fg-3:#8d86a0;
  --accent:#9d7dff;
  --accent-hi:#c4b1ff;
  --accent-lo:#6a43ee;
  --accent-deep:#4b2bb8;
  --accent-wash:rgba(157,125,255,.14);
  --accent-ink:#0e0919;
  --good:#3ccf7e; --good-deep:#1f8f52; --good-wash:rgba(60,207,126,.13);
  --bad:#ff6b6b; --bad-deep:#c23b3b; --bad-wash:rgba(255,107,107,.13);
  --warn:#fab219;
  --flame:#ff9a3c; --flame-hi:#ffd166; --flame-off:#4a4458;
  --ice:#7cc8ff;
  --gem:#c4b1ff;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --glow:rgba(122,84,255,.22);
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:9px;
  --tabh:64px;
}
:root[data-app-theme="light"],
:root[data-app-theme="auto"][data-theme="light"]{
  color-scheme:light;
  --bg:#f6f4fb; --surface:#ffffff; --surface-2:#f1edfa; --surface-3:#e6e0f5;
  --line:#e3ddf0; --line-2:#cdc3e6;
  --fg:#16131f; --fg-2:#463f57; --fg-3:#736c86;
  --accent:#6a43ee; --accent-hi:#8466f3; --accent-lo:#5531d9; --accent-deep:#3d1fae;
  --accent-wash:rgba(106,67,238,.10); --accent-ink:#ffffff;
  --good:#15924f; --good-deep:#0e6b39; --good-wash:rgba(21,146,79,.10);
  --bad:#d63b3b; --bad-deep:#a42424; --bad-wash:rgba(214,59,59,.09);
  --warn:#b87900; --flame:#f07c12; --flame-hi:#ffb547; --flame-off:#cbc4dc; --ice:#2f8fd8; --gem:#6a43ee;
  --shadow:0 10px 30px rgba(40,20,90,.12); --glow:rgba(122,84,255,.14);
}
@media (prefers-color-scheme: light){
  :root[data-app-theme="auto"]:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f6f4fb; --surface:#ffffff; --surface-2:#f1edfa; --surface-3:#e6e0f5;
    --line:#e3ddf0; --line-2:#cdc3e6;
    --fg:#16131f; --fg-2:#463f57; --fg-3:#736c86;
    --accent:#6a43ee; --accent-hi:#8466f3; --accent-lo:#5531d9; --accent-deep:#3d1fae;
    --accent-wash:rgba(106,67,238,.10); --accent-ink:#ffffff;
    --good:#15924f; --good-deep:#0e6b39; --good-wash:rgba(21,146,79,.10);
    --bad:#d63b3b; --bad-deep:#a42424; --bad-wash:rgba(214,59,59,.09);
    --warn:#b87900; --flame:#f07c12; --flame-hi:#ffb547; --flame-off:#cbc4dc; --ice:#2f8fd8; --gem:#6a43ee;
    --shadow:0 10px 30px rgba(40,20,90,.12); --glow:rgba(122,84,255,.14);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-stretch:118%;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:780;line-height:1.08}
h2{font-size:21px;font-weight:740;line-height:1.15}
h3{font-size:16.5px;font-weight:700;line-height:1.2}
.small{font-size:12.5px}
.muted{color:var(--fg-3)}
.fg2{color:var(--fg-2)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:680;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-stretch:112%}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:17px;height:17px}
.ic.lg{width:28px;height:28px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.tight{gap:8px}
.stack.loose{gap:18px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
.mt{margin-top:14px}

/* ---------- marco ---------- */
#app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tabh) + 34px + env(safe-area-inset-bottom,0px));position:relative;min-height:100vh}
#app::before{content:"";position:absolute;left:0;right:0;top:-40px;height:340px;background:radial-gradient(80% 70% at 50% 0%,var(--glow),transparent 70%);pointer-events:none;z-index:-1}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;padding:10px 0 8px;background:linear-gradient(var(--bg) 66%,transparent)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 11px;border-radius:12px;font-weight:720;font-size:15.5px;font-variant-numeric:tabular-nums;font-stretch:108%}
.pill:active{background:var(--surface-3)}
.flagbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 9px 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.flag{width:28px;height:20px;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.flag svg{display:block;width:100%;height:100%}
.flag.lg{width:44px;height:31px;border-radius:7px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px;color:var(--fg-2)}
.icon-btn:active{background:var(--surface-3)}
.view{display:flex;flex-direction:column;gap:16px;padding-top:4px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px;height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg-3);font-size:11px;font-weight:650;font-stretch:108%;border-radius:14px;position:relative}
.tab[aria-current="page"]{color:var(--accent-hi)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:6px;width:44px;height:30px;border-radius:12px;background:var(--accent-wash);z-index:-1}
.tab .dot{position:absolute;top:8px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--flame);box-shadow:0 0 0 2px var(--bg)}

/* ---------- piezas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px}
.card.flat{background:var(--surface-2);border-color:transparent}
.card.accent{background:linear-gradient(140deg,color-mix(in srgb,var(--accent-lo) 30%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.card.warn{border-color:color-mix(in srgb,var(--flame) 55%,var(--line));background:linear-gradient(140deg,color-mix(in srgb,var(--flame) 16%,var(--surface)),var(--surface) 70%)}
.card.tap{text-align:left;width:100%;display:block;transition:transform .12s}
.card.tap:active{transform:scale(.985)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-hi)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--accent-wash);color:var(--accent-hi);font-stretch:108%}
.tag.good{background:var(--good-wash);color:var(--good)}
.tag.bad{background:var(--bad-wash);color:var(--bad)}
.tag.flame{background:color-mix(in srgb,var(--flame) 18%,transparent);color:var(--flame)}
.tag.ice{background:color-mix(in srgb,var(--ice) 18%,transparent);color:var(--ice)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font-weight:760;font-size:16px;letter-spacing:.02em;font-stretch:112%;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--fg);box-shadow:0 4px 0 var(--line-2);border:1px solid var(--line-2)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line-2)}
.btn.good{background:var(--good);color:#04130a;box-shadow:0 4px 0 var(--good-deep)}
.btn.bad{background:var(--bad);color:#1a0505;box-shadow:0 4px 0 var(--bad-deep)}
.btn.sm{min-height:40px;font-size:13.5px;padding:0 14px;border-radius:13px}
.btn.text{background:none;box-shadow:none;color:var(--accent-hi);min-height:40px;text-transform:none;letter-spacing:0;font-weight:680}
.btn:disabled{background:var(--surface-3);color:var(--fg-3);box-shadow:0 4px 0 var(--line)}
.link{color:var(--accent-hi);font-weight:650;text-decoration:none}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:650;color:var(--fg-2)}
.input,textarea.input,select.input{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface-2);font-size:17px;outline:none}
textarea.input{min-height:96px;resize:none;line-height:1.4}
.input:focus{border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:38px;border-radius:10px;font-weight:650;font-size:14px;color:var(--fg-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line-2),0 0 0 1px var(--line-2)}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--surface-3);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.list{display:flex;flex-direction:column}
.list > *{padding:13px 0;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.setrow .ic{color:var(--fg-3)}

.bar{height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent-lo),var(--accent));transition:width .35s}
.bar.good > i{background:linear-gradient(90deg,var(--good-deep),var(--good))}
.bar.flame > i{background:linear-gradient(90deg,var(--flame),var(--flame-hi))}

/* racha */
.flame-ic{width:22px;height:22px;flex:none}
.flame-ic.xl{width:76px;height:76px}
.streak-hero{display:flex;align-items:center;gap:14px}
.streak-num{font-size:44px;font-weight:800;font-stretch:125%;line-height:1;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:650;color:var(--fg-3)}
.week .b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3)}
.week .b.on{background:color-mix(in srgb,var(--flame) 85%,transparent)}
.week .b.ice{background:color-mix(in srgb,var(--ice) 70%,transparent)}
.week .b.today{box-shadow:0 0 0 2px var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11px;color:var(--fg-3);font-weight:650}
.cal .c{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12.5px;font-weight:650;color:var(--fg-3);background:var(--surface-2)}
.cal .c.on{background:color-mix(in srgb,var(--flame) 80%,transparent);color:#2a1300}
.cal .c.ice{background:color-mix(in srgb,var(--ice) 65%,transparent);color:#03233a}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .c.empty{background:none}

/* anillo de meta */
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:760}
.ring.lg{width:84px;height:84px}
.ring.lg .t{font-size:18px}

/* ---------- camino ---------- */
.unit{display:flex;flex-direction:column;gap:6px}
.level-div{display:flex;flex-direction:column;gap:2px;padding:18px 4px 2px;border-top:1px solid var(--line);margin-top:6px}
.level-div .lv{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-hi);font-stretch:116%}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.ladder .st{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;font-weight:750;color:var(--fg-3)}
.ladder .st .b{width:100%;height:8px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.ladder .st .b i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-lo),var(--accent))}
.ladder .st.cur{color:var(--accent-hi)}
.unit-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-xl);background:linear-gradient(120deg,var(--accent-lo),color-mix(in srgb,var(--accent-lo) 55%,#1b0f45));color:#fff;box-shadow:0 4px 0 var(--accent-deep)}
.unit-head.lock{background:var(--surface-2);color:var(--fg-3);box-shadow:0 4px 0 var(--line)}
.unit-head .u-ic{font-size:30px;line-height:1}
.unit-head h3{color:inherit}
.unit-head .sub{font-size:12.5px;opacity:.85;font-weight:600}
.unit-head .guide{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.16);font-weight:700;font-size:13px;color:inherit}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px 0 10px}
.node-wrap.cur{margin-top:34px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:72px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--accent);color:#fff;box-shadow:0 7px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;position:relative}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--accent-deep)}
.node.done{background:linear-gradient(160deg,var(--flame-hi),var(--flame));box-shadow:0 7px 0 #b55a10}
.node.lock{background:var(--surface-3);color:var(--fg-3);box-shadow:0 7px 0 var(--line)}
.node.review{border-radius:22px}
.node .ic{width:30px;height:30px;stroke-width:2.4}
.node-wrap.cur::before{content:"";position:absolute;top:-9px;width:90px;height:90px;border-radius:50%;border:4px solid var(--accent-wash);animation:pulse 2s infinite}
.bubble{position:absolute;top:-44px;white-space:nowrap;padding:7px 12px;border-radius:12px;background:var(--surface);border:2px solid var(--accent);color:var(--accent-hi);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-stretch:112%;animation:bob 1.6s ease-in-out infinite;z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:translateX(-50%) rotate(45deg)}
.node-label{margin-top:12px;font-size:12px;font-weight:650;color:var(--fg-3);max-width:140px;text-align:center}
.stars{position:absolute;bottom:-4px;right:-6px;font-size:13px;background:var(--surface);border-radius:999px;padding:1px 5px;border:1px solid var(--line)}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- capas ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:rise .22s ease-out}
.overlay-in{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;padding:0 16px}
.ov-top{display:flex;align-items:center;gap:12px;padding:12px 0}
.ov-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:6px 2px 20px}
.ov-foot{padding:12px 0 16px;display:flex;flex-direction:column;gap:10px}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet-back{position:fixed;inset:0;z-index:80;background:rgba(4,2,10,.6);animation:fade .18s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line-2);animation:up .24s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}

    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);

    else if (kind === 'bad') { this.tone(220, 0, 0.18, 'sawtooth', 0.07); this.tone(180, 0.12, 0.22, 'sawtooth', 0.06); }

    else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.09, 0.25, 'triangle', 0.12)); }
    else if (kind === 'streak') { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * 0.07, 0.3, 'triangle', 0.11)); }

function confetti(n) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'); if (!cv) return;
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cols = ['#9d7dff', '#c4b1ff', '#ff9a3c', '#ffd166', '#3ccf7e', '#7cc8ff'];
  const ps = Array.from({ length: n || 140 }, () => ({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.35, vx: (Math.random() - 0.5) * 22 * devicePixelRatio, vy: (-Math.random() * 20 - 8) * devicePixelRatio, s: (5 + Math.random() * 7) * devicePixelRatio, c: cols[rand(cols.length)], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 }));
  let f = 0;
  (function step() {
    ctx.clearRect(0, 0, W, H); f++;
    ps.forEach((p) => { p.vy += 0.7 * devicePixelRatio; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (f < 160) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  })();
}

/* ============ Parla · almacenamiento ============
   Dentro de Claude (artefacto): base de datos del artefacto, en la carpeta privada de cada persona
   (data/users/<id>/…). Solo pueden escribir en ella el propietario y quien tenga permiso para guardar
   (en un plan personal: invitados por correo como «Editor» y con el enlace público desactivado).
   Quien entra con el enlace público tiene acceso de lectura: su progreso queda en este navegador.
   En Safari (iPhone) el almacenamiento de las páginas incrustadas se borra al cerrar Safari, así que
   esas personas pueden guardar y recuperar su progreso con un código (Ajustes → Tus datos).
   Cada documento lleva su hora de guardado (_t): al cargar se usa siempre la copia más reciente. */

        try { this.owner = await this.user.isOwner(); } catch (e) { this.owner = true; }
        try { this.canWrite = await this.user.can('data.write'); } catch (e) { this.canWrite = null; }
      }

        if (this.canWrite === false || (this.canWrite !== true && !this.owner && this.lsGet('ro:' + this.uid))) this.readOnly = true;
        else this.mode = 'cloud';
      } else if (this.inClaude) this.readOnly = true;
    } catch (e) { console.warn('db no disponible', e); this.readOnly = true; }
  },
  /* En Safari/iOS, lo que guarda una página incrustada (como un artefacto) se borra al cerrar el navegador. */
  ephemeral() { return this.inClaude && this.mode !== 'cloud' && (/iP(hone|ad|od)/.test(navigator.userAgent) || (/Safari\//.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Firefox|Android/.test(navigator.userAgent))); },

  lsGet(k) { try { const v = localStorage.getItem(this.P + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  lsSet(k, v) { try { if (v == null) localStorage.removeItem(this.P + k); else localStorage.setItem(this.P + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  cloudKey(name) { return 'c:' + this.uid + ':' + name; },

  ref(name) { return this.db.doc('data/users/' + this.uid + '/' + name); },

  localCandidates(name) {
    const keys = uniq([this.localKey(name), name].concat(this.uid ? [this.cloudKey(name)] : []));
    return keys.map((k, i) => { const v = this.lsGet(k); if (!v) return null; const data = v.data !== undefined ? v.data : v; return data ? { data, t: (data && data._t) || 0, rank: i, dirty: !!v.dirty } : null; }).filter(Boolean);
  },
  newest(list) { return list.slice().sort((a, b) => (b.t - a.t) || (a.rank - b.rank))[0] || null; },

  async load(name) {

  /* Sin permiso de escritura: el progreso pasa a este navegador y no vuelve a intentarse la nube. */

  async init() {
    try { if (this.inClaude()) this.fn = await window.claude.use('sample'); } catch (e) { this.fn = null; }
    if (this.fn) { this.mode = 'claude'; this.state = 'ready'; return; }
    if (!this.inClaude()) this.initApi();
  },
  ok() { return this.state === 'ready'; },

  /* Une las instrucciones con la conversación. «sample» no tiene rol de sistema:
     las instrucciones van delante del primer mensaje del usuario. */
  turns(system, messages) {
    const ms = (typeof messages === 'string' ? [{ role: 'user', content: messages }] : messages).map((m) => ({ role: m.role, content: m.content }));
    while (ms.length && ms[0].role !== 'user') ms.shift();
    if (!ms.length) ms.push({ role: 'user', content: '(Empieza tú.)' });
    // fusiona turnos seguidos del mismo rol
    const out = [];
    ms.forEach((m) => { const l = out[out.length - 1]; if (l && l.role === m.role) l.content += '\n\n' + m.content; else out.push(m); });
    if (out[out.length - 1].role !== 'user') out.push({ role: 'user', content: '(Sigue.)' });
    return out;
  },

  /* Texto con streaming. o: {system, messages, onText, signal, tier} */
  async text(o) {
    const turns = this.turns(o.system, o.messages);
    if (this.mode === 'claude') {
      const input = turns.map((m, i) => (i === 0 && o.system ? { role: m.role, content: '<instrucciones>\n' + o.system + '\n</instrucciones>\n\n' + m.content } : m));
      const r = await this.fn(input, { onText: o.onText ? (u) => o.onText(u.text) : undefined, signal: o.signal, cache: false, modelTier: o.tier || 'default' });
      return r.text;
    }
    if (this.mode !== 'api') throw { code: 'no_ai' };
    let text = '';
    try {
      const client = await this.apiClient();
      const stream = client.beta.messages.stream({
        model: API_MODEL,
        max_tokens: 16000,
        system: o.system || undefined,
        output_config: { effort: o.tier === 'complex' ? 'medium' : 'low' },
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        messages: turns,
      }, { signal: o.signal });
      stream.on('text', (d, snap) => { text = snap; if (o.onText) o.onText(snap); });
      const fin = await stream.finalMessage();
      if (fin.stop_reason === 'refusal') throw { code: 'refused' };
      const out = fin.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
      if (!out.trim()) throw { code: 'empty_completion' };
      return out;
    } catch (e) { throw this.apiErr(e); }
  },

  /* Respuesta en JSON. o: {system, prompt, tier} */
  async json(o) {
    const fmt = '\n\nResponde únicamente con un objeto JSON válido, sin texto antes ni después y sin bloques de código.';
    if (this.mode === 'claude') {
      const input = (o.system ? '<instrucciones>\n' + o.system + '\n</instrucciones>\n\n' : '') + o.prompt + fmt;
      return await this.fn.json(input, { modelTier: o.tier || 'default' });
    }
    if (this.mode !== 'api') throw { code: 'no_ai' };
    let res;
    try {
      const client = await this.apiClient();
      res = await client.beta.messages.create({
        model: API_MODEL,
        max_tokens: 16000,
        system: o.system || undefined,
        output_config: { effort: 'low' },
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        messages: [{ role: 'user', content: o.prompt + fmt }],
      });
    } catch (e) { throw this.apiErr(e); }
    if (res.stop_reason === 'refusal') throw { code: 'refused' };
    const t = res.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) throw { code: 'invalid_json' };
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw { code: 'invalid_json' }; }
  },

  async apiClient() {
    if (this.client) return this.client;
    if (!this.sdk) { try { this.sdk = await import(SDK_URL); } catch (e) { throw { code: 'sdk_load' }; } }
    this.client = new this.sdk.default({ apiKey: this.getKey(), dangerouslyAllowBrowser: true });
    return this.client;
  },
  apiErr(e) {
    const S = this.sdk || {};
    if (e && e.code && !(e instanceof Error)) return e;
    if (e && e.name === 'AbortError') return { code: 'cancelled' };
    if (S.APIUserAbortError && e instanceof S.APIUserAbortError) return { code: 'cancelled' };
    if (S.AuthenticationError && e instanceof S.AuthenticationError) return { code: 'bad_key' };
    if (S.PermissionDeniedError && e instanceof S.PermissionDeniedError) return { code: 'denied' };
    if (S.RateLimitError && e instanceof S.RateLimitError) return { code: 'rate_limited' };
    if (S.BadRequestError && e instanceof S.BadRequestError) {
      const m = String((e && e.message) || '');
      if (/credit balance/i.test(m)) return { code: 'no_credit' };
      if (/too long|too large/i.test(m)) return { code: 'prompt_too_large' };
      return { code: 'upstream_error' };
    }
    console.warn('API', e);
    return { code: 'upstream_error' };
  },
  msg(e) {
    const c = (e && e.code) || 'upstream_error';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(c) >= 0) {
      this.state = 'denied';
      if (c === 'not_granted') return 'No has dado permiso a Parla para usar Claude. Recarga y acepta el aviso para activar el tutor.';
      return 'La IA no está disponible en esta cuenta o vista.';
    }
    switch (c) {
      case 'cancelled': return '';
      case 'no_ai': return 'El tutor IA funciona dentro de Claude o, fuera de Claude, con tu clave de API (Ajustes → Tutor IA).';
      case 'rate_limited': return 'Has llegado al límite de uso por ahora. Prueba dentro de un rato.';
      case 'session_expired': return 'Tu sesión de Claude ha caducado. Vuelve a iniciar sesión y recarga.';
      case 'refused': return 'La IA no ha respondido a esto. Reformúlalo.';
      case 'empty_completion': return 'No ha llegado respuesta. Prueba otra vez.';
      case 'invalid_json': return 'La respuesta no tenía el formato esperado. Vuelve a intentarlo.';
      case 'prompt_too_large': return 'Demasiado texto para una sola consulta. Empieza una conversación nueva.';
      case 'bad_key': return 'La clave de API no es válida. Cámbiala en Ajustes → Tutor IA.';
      case 'denied': return 'Anthropic ha rechazado la petición.';
      case 'no_credit': return 'Tu cuenta de la API no tiene saldo. Añade crédito en console.anthropic.com.';
      case 'sdk_load': return 'No se ha podido conectar con Claude. Revisa tu conexión.';
      default: return 'Fallo de conexión con la IA. Inténtalo de nuevo.';
    }
  },
};

/* ============ Parla · hablar y escuchar ============
   Escuchar: voces del sistema (speechSynthesis). En iPhone, las voces de catalán y alemán se descargan en
   Ajustes → Accesibilidad → Contenido leído → Voces.
   Hablar: reconocimiento de voz del navegador cuando existe (Safari en pestaña, Chrome).
   Si no hay (app de pantalla de inicio en iPhone, artefacto de Claude), se usa el dictado del teclado. */
const LANG_TAGS = { ca: 'ca-ES', de: 'de-DE', en: 'en-GB', fr: 'fr-FR', it: 'it-IT', pt: 'pt-PT', es: 'es-ES' };
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|eddy|flo\b|grandma|grandpa|reed|rocko|sandy|shelley|junior|ralph|fred|kathy/i;
const Speech = {
  voices: [], rate: 0.95, prefs: {}, micBlocked: false, rec: null, speaking: false,
  init() {
    if (!('speechSynthesis' in window)) return;
    const load = () => { try { this.voices = speechSynthesis.getVoices() || []; } catch (e) { this.voices = []; } };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  tag(lang) { return LANG_TAGS[lang] || lang; },
  list(lang) {
    const pre = this.tag(lang).slice(0, 2).toLowerCase();
    return this.voices.filter((v) => (v.lang || '').toLowerCase().replace('_', '-').indexOf(pre) === 0);
  },
  score(v, lang) {
    let s = 0; const n = v.name || '';
    if (NOVELTY.test(n)) s -= 50;
    if (/premium|enhanced|mejorada|natural|neural|siri/i.test(n)) s += 20;
    if ((v.lang || '').replace('_', '-').toLowerCase() === this.tag(lang).toLowerCase()) s += 8;
    if (v.localService) s += 3;
    if (/google/i.test(n)) s += 2;
    return s;
  },
  voice(lang) {
    const vs = this.list(lang); if (!vs.length) return null;
    const want = this.prefs[lang];
    if (want) { const v = vs.find((x) => x.voiceURI === want); if (v) return v; }
    return vs.slice().sort((a, b) => this.score(b, lang) - this.score(a, lang))[0];
  },
  hasVoice(lang) { return this.list(lang).length > 0; },
  canSpeak() { return 'speechSynthesis' in window; },
  speak(text, lang, o) {
    o = o || {};
    if (!this.canSpeak() || !text) return Promise.resolve(false);
    return new Promise((res) => {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text));
        u.lang = this.tag(lang);
        const v = this.voice(lang); if (v) u.voice = v;
        u.rate = o.slow ? 0.62 : this.rate;
        u.onend = () => { this.speaking = false; res(true); };
        u.onerror = () => { this.speaking = false; res(false); };
        this.speaking = true;
        speechSynthesis.speak(u);
        setTimeout(() => { if (this.speaking && !speechSynthesis.speaking) { this.speaking = false; res(false); } }, 15000);
      } catch (e) { res(false); }
    });
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} },

  SR() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; },
  canListen() { return !!this.SR() && !this.micBlocked; },
  /* Escucha una frase. Devuelve {text, alts} o lanza {code}. */
  listen(lang, o) {
    o = o || {};
    const SR = this.SR();
    if (!SR || this.micBlocked) return Promise.reject({ code: 'unsupported' });
    this.cancelListen();
    return new Promise((res, rej) => {
      let done = false, best = '', alts = [];
      const r = new SR(); this.rec = r;
      r.lang = this.tag(lang); r.interimResults = true; r.continuous = false; r.maxAlternatives = 4;
      const finish = (err) => { if (done) return; done = true; clearTimeout(to); this.rec = null; if (err) rej(err); else if (best) res({ text: best, alts }); else rej({ code: 'no-speech' }); };
      r.onresult = (ev) => {
        let txt = '';
        for (let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
        best = txt.trim();
        const last = ev.results[ev.results.length - 1];
        alts = []; for (let j = 0; j < last.length; j++) alts.push(last[j].transcript.trim());
        if (o.onInterim) o.onInterim(best);
        if (last.isFinal) { try { r.stop(); } catch (e) {} }
      };
      r.onerror = (ev) => {
        const code = ev.error || 'error';
        if (code === 'not-allowed' || code === 'service-not-allowed' || code === 'audio-capture') this.micBlocked = true;
        finish({ code });
      };
      r.onend = () => finish(null);
      const to = setTimeout(() => { try { r.stop(); } catch (e) {} }, o.max || 9000);
      try { r.start(); } catch (e) { finish({ code: 'start' }); }
    });
  },
  cancelListen() { if (this.rec) { try { this.rec.abort(); } catch (e) {} this.rec = null; } },
};

    tip: 'Para narrar el pasado por escrito el alemán usa el Präteritum. Los verbos regulares añaden -te: «spielen» → «ich spielte», «wir spielten». Los irregulares cambian la vocal: «gehen» → «ging», «fahren» → «fuhr». «Sein», «haben» y los modales se usan en Präteritum incluso al hablar: «war», «hatte», «konnte».\n\nNo hay diferencia entre indefinido e imperfecto: «ich ging» vale para «fui» y para «iba».\n\n«Als» se usa para un momento o una etapa única del pasado: «Als ich klein war…» (cuando era pequeño). En pasado, «wenn» se usa para acciones repetidas: «Wenn es regnete, spielten wir zu Hause» (cada vez que llovía).' },

    tip: 'Los conectores alemanes cambian el orden de la frase. Hay tres grupos.\n\nSubordinantes («weil», «obwohl», «dass», «wenn», «auch wenn»): el verbo conjugado se va al final: «obwohl der Vorschlag interessant ist». Si la subordinada va delante, la principal empieza por el verbo: «Obwohl…, halte ich ihn für unrealistisch».\n\nAdverbios («trotzdem», «deshalb», «deswegen»): cuentan como un elemento más de la frase. Si ocupan la posición 1, el verbo va justo detrás y el sujeto después: «Deshalb ziehen viele weg». También pueden ir tras el verbo: «Es überzeugt mich trotzdem nicht». En cambio, «und», «aber», «oder» y «denn» no alteran nada.\n\n«Einerseits…, andererseits…» = por un lado…, por otro. «Je mehr…, desto…» = cuanto más…, más (o menos).' },

  { id: 'plurals', name: 'Plurales', cefr: 'A2', icon: '📚',

  { id: 'preposicions', name: 'Preposiciones', cefr: 'B1', icon: '🧭',
    tip: "A indica destino y lugar, también ante nombres de ciudad: Vaig a Girona. Visc a Barcelona (nunca «en Barcelona»). También se usa con las horas: a les deu. En se usa sobre todo ante un, algun o aquest: en un poble. Para el transporte: en tren, amb tren, a peu.\n\nAmb equivale a «con»: Vine amb nosaltres. Per indica causa, lugar de paso y medio: Passem per Igualada. Gràcies per tot. Parlem per telèfon.\n\nPer a indica destinatario o finalidad ante un nombre: Aquest regal és per a tu. Ante infinitivo se usa per (también se acepta per a): Estudio per aprendre. Cuidado: pensar en algo, como en español.",
    items: [
      "Visc ___ Barcelona des de fa anys.|a|en;amb;per|Vivo en Barcelona desde hace años.|Ante nombres de ciudad se usa a: visc a Barcelona.",
      "Demà anem ___ cinema amb els amics.|al|en el;a el;per el|Mañana vamos al cine con los amigos.|Destino: a, que con el artículo el se contrae en al.",
      "Vols venir ___ nosaltres?|amb|en;a;de|¿Quieres venir con nosotros?|Compañía: amb (con).",
      "Aquest regal és ___ tu.|per a|per;pera;a|Este regalo es para ti.|Destinatario ante nombre o pronombre: per a tu.",
      "Estudio català ___ parlar amb els meus avis.|per;per a|a;amb;de|Estudio catalán para hablar con mis abuelos.|Finalidad ante infinitivo: per (también se acepta per a).",
      "Per anar a Lleida passem ___ Igualada.|per|per a;a;en|Para ir a Lleida pasamos por Igualada.|Lugar por donde se pasa: per.",
      "Gràcies ___ la teva ajuda.|per|per a;de;a|Gracias por tu ayuda.|Causa o motivo: gràcies per.",
      "M'agrada anar ___ bicicleta.|en;amb|a;per;de|Me gusta ir en bicicleta.|Medio de transporte: en bicicleta o amb bicicleta.",
      "La reunió és ___ les deu.|a|en;de|La reunión es a las diez.|Con las horas se usa a: a les deu.",
      "Sóc ___ Girona, però visc a Reus.|de|a;en;des|Soy de Girona, pero vivo en Reus.|Origen: de.",
      "Un cafè ___ llet, si us plau.|amb|en;de;a|Un café con leche, por favor.|Amb equivale a «con»: cafè amb llet.",
      "Vaig ___ peu a la feina.|a|en;amb;de|Voy a pie al trabajo.|La expresión es anar a peu.",
      "Pensa ___ mi!|en|a;de;amb|¡Piensa en mí!|Pensar en algo o alguien, como en español.",
      "Parlem ___ telèfon demà.|per|en;amb;a|Hablamos por teléfono mañana.|Medio de comunicación: per telèfon."
    ] },

  { id: 'febles', name: 'Pronombres débiles', cefr: 'B1', icon: '🧩',
    tip: "Los pronombres débiles sustituyen complementos para no repetirlos. Complemento directo determinado: el, la, els, les, con l' ante vocal: Veus el cotxe? Sí, el veig. L'he vist.\n\nEn sustituye un complemento indeterminado, una cantidad o un complemento con de: Vols cafè? Sí, en vull. Tens germans? En tinc tres. Hi sustituye complementos de lugar y otros con a, en o amb: Vas a la platja? Sí, hi vaig. Ho sustituye una frase o idea completa y el atributo: No ho sé. Sí, ho és.\n\nEl complemento indirecto es li (le). Con imperativo e infinitivo van detrás con guion: Explica-li tot. Vull veure-la.",
    items: [
      "Veus aquell noi? Sí, ___ veig.|el|lo;li;en|¿Ves a aquel chico? Sí, lo veo.|CD masculino determinado: el. «Lo» no es correcto aquí.",
      "Has vist en Pau? No, no ___ vist.|l'he|el he;li he;lo he|¿Has visto a Pau? No, no lo he visto.|Ante vocal o h el pronombre se apostrofa: l'he vist.",
      "Vols cafè? Sí, ___ vull una mica.|en|el;ho;lo|¿Quieres café? Sí, quiero un poco.|CD indeterminado o cantidad: en vull una mica.",
      "Tens germans? Sí, ___ tinc tres.|en|els;los;hi|¿Tienes hermanos? Sí, tengo tres.|Con una cantidad se usa en: en tinc tres.",
      "Vas a la platja? Sí, ___ vaig ara.|hi|en;la;ho|¿Vas a la playa? Sí, voy ahora.|Complemento de lugar: hi vaig.",
      "Saps on viu en Pere? No, no ___ sé.|ho|lo;el;en|¿Sabes dónde vive Pere? No, no lo sé.|Una frase o idea completa se sustituye por ho: no ho sé.",
      "Les entrades? ___ tinc a la bossa.|Les|Els;Las|¿Las entradas? Las tengo en el bolso.|CD femenino plural determinado: les.",
      "Truca a la teva mare i explica-___ tot.|li|la;el;l'|Llama a tu madre y explícale todo.|Complemento indirecto (a la mare): li, detrás del imperativo con guion.",
      "Aquest llibre és molt bo. ___ llegit? (tu)|L'has|El has;Lo has;Li has|Este libro es muy bueno. ¿Lo has leído?|El ante vocal o h se apostrofa: l'has llegit.",
      "Penses en l'examen? Sí, ___ penso molt.|hi|en;el;ho|¿Piensas en el examen? Sí, pienso mucho en él.|Pensar en algo: el complemento con en se sustituye por hi.",
      "Vinc de Girona. Jo també ___ vinc.|en|hi;de;ho|Vengo de Girona. Yo también vengo de allí.|Lugar de origen (con de): en vinc.",
      "El teu pare és metge? Sí, ___ és.|ho|el;lo;en|¿Tu padre es médico? Sí, lo es.|El atributo de ser se sustituye por ho: ho és.",
      "Aquesta pel·lícula és nova, vull veure-___.|la|lo;el;li|Esta película es nueva, quiero verla.|CD femenino: la, detrás del infinitivo con guion.",
      "Has vist els nens? Sí, ___ he vist al parc.|els|les;los;el|¿Has visto a los niños? Sí, los he visto en el parque.|CD masculino plural: els. No se apostrofa."
    ] },

  { id: 'accents', name: 'Acento abierto, cerrado y diacrítico', cefr: 'B1', icon: '📝',
    tip: "El catalán tiene dos acentos. El grave (à, è, ò) marca vocal abierta y el agudo (é, í, ó, ú) vocal cerrada. La a siempre lleva grave (mà, català) y la i y la u siempre agudo (així, ningú). En la e y la o depende del sonido: cafè, però (abiertas), també, cançó (cerradas).\n\nEl acento diacrítico distingue palabras que se escriben igual: és (verbo) y es (pronombre), més (cantidad) y mes (del año), sí (afirmación) y si (condición), té (de tenir) y te (pronombre o infusión), sé (de saber), bé (bien), mà (mano), són y sóc (de ser), món, pèl, déu, ús, vós.\n\nDesde la normativa de 2016 otras palabras ya no lo llevan: dona (de donar), venen, vens, net.",
    items: [
      "La Marta ___ de Mallorca.|és|es;ès|Marta es de Mallorca.|És (verbo ser) lleva acento agudo para distinguirlo del pronombre es.",
      "Vull ___ pa, si us plau.|més|mes;mès|Quiero más pan, por favor.|Més (cantidad) lleva acento. Mes sin acento es el mes del año.",
      "El ___ de juliol fa molta calor.|mes|més;mès|En el mes de julio hace mucho calor.|Mes (del año) no lleva acento. Més es «más».",
      "___, vull venir amb tu.|Sí|Si;Sì|Sí, quiero ir contigo.|Sí afirmativo lleva acento. En catalán la i solo lleva acento agudo.",
      "___ plou, no sortirem.|Si|Sí;Sì|Si llueve, no saldremos.|Si condicional no lleva acento.",
      "La meva germana ___ dos fills.|té|te;tè|Mi hermana tiene dos hijos.|Té (de tenir) lleva acento. Te es pronombre o infusión.",
      "Vols un ___ amb llimona?|te|té;tè|¿Quieres un té con limón?|Al revés que en español, la infusión te no lleva acento en catalán.",
      "No ___ on viu.|sé|se;sè|No sé dónde vive.|Sé (de saber) lleva acento para distinguirlo del pronombre se.",
      "Avui em trobo molt ___.|bé|be;bè|Hoy me encuentro muy bien.|Bé (bien) lleva acento agudo. Be es el cordero.",
      "M'he tallat la ___ amb el ganivet.|mà|ma;má|Me he cortado la mano con el cuchillo.|Mà (mano) lleva acento, y la a siempre lo lleva grave.",
      "Prenc un ___ cada matí.|cafè|café;cafe|Tomo un café cada mañana.|La e de cafè es abierta: acento grave, no agudo como en español.",
      "Jo ___ vull anar-hi.|també|tambè;tambe|Yo también quiero ir.|La e de també es cerrada: acento agudo.",
      "Aquesta ___ m'agrada molt.|cançó|cançò;canço|Esta canción me gusta mucho.|La o de cançó es cerrada: acento agudo.",
      "El meu avi sempre em ___ caramels.|dona|dóna;dòna|Mi abuelo siempre me da caramelos.|Desde la normativa de 2016, dona (de donar) ya no lleva acento."
    ] },

  { id: 'relatius', name: 'Relativos', cefr: 'B2', icon: '🔁',
    tip: "El relativo más común es que, para personas y cosas, como sujeto o complemento directo: El noi que parla és el meu cosí. El llibre que llegeixo és bo.\n\nDetrás de preposición se usa qui para personas y què (con acento) para cosas: La noia amb qui surto. El tema de què parlem. También se puede usar el qual, la qual, els quals, les quals: la raó per la qual. Para lugares, on: la ciutat on visc. Para «cuyo», del qual detrás del nombre: l'amic el germà del qual viu a Berlín.\n\nEvita los calcos «en la que» o «lo que»: la casa on visc (o en què visc), el que m'agrada.",
    items: [
      "El noi ___ parla amb la Marta és el meu cosí.|que|qui;què;el qual|El chico que habla con Marta es mi primo.|Sujeto sin preposición: que, también para personas.",
      "La noia amb ___ surto és de Sabadell.|qui;la qual|que;què;quina|La chica con la que salgo es de Sabadell.|Tras preposición, para personas: qui o la qual.",
      "La ciutat ___ visc és molt tranquil·la.|on;en què;en la qual|que;qui;quan|La ciudad donde vivo es muy tranquila.|Para lugares se usa on (o en què, en la qual).",
      "El tema de ___ parlem és molt important.|què|que;qui;quin|El tema del que hablamos es muy importante.|Tras preposición, para cosas: què, con acento.",
      "Aquest és l'amic el germà ___ viu a Berlín.|del qual|que;el qual;cuyo|Este es el amigo cuyo hermano vive en Berlín.|Para expresar «cuyo»: nombre + del qual.",
      "Les persones ___ treballen aquí són molt amables.|que|qui;què;on|Las personas que trabajan aquí son muy amables.|Sujeto en relativo especificativo: que, no qui.",
      "No trobo el bolígraf amb ___ escric sempre.|què;el qual|que;qui;quin|No encuentro el bolígrafo con el que siempre escribo.|Tras preposición, para cosas: què o el qual.",
      "La Marta, ___ viu a Londres, vindrà per Nadal.|que;la qual;qui|què;on;quina|Marta, que vive en Londres, vendrá por Navidad.|En el relativo explicativo valen que, la qual y también qui.",
      "Aquesta és la raó per ___ no vaig venir.|la qual;què|que;qui;la que|Esta es la razón por la que no vine.|Tras preposición: la qual o què. «Per la que» es un calco del español.",
      "Recordes el dia ___ ens vam conèixer?|que;en què;en el qual|on;qui;quan|¿Recuerdas el día que nos conocimos?|Con expresiones de tiempo: que o en què. On solo es para lugares.",
      "___ m'agrada més és viatjar.|El que;Allò que|Lo que;Què;Qui|Lo que más me gusta es viajar.|Neutro: el que o allò que. «Lo que» no es catalán.",
      "ORDER|La casa on vaig néixer és a Vic.|La casa donde nací está en Vic.|On introduce un relativo de lugar: la casa on vaig néixer.",
      "ORDER|Els amics amb qui viatjo són de Girona.|Los amigos con los que viajo son de Girona.|Tras preposición, para personas: qui.",
      "ORDER|El llibre que em vas deixar és fantàstic.|El libro que me prestaste es fantástico.|Que sin preposición sirve para personas y cosas."
    ] },

  { id: 'febles2', name: 'Combinaciones de pronombres', cefr: 'B2', icon: '🔀',
    tip: "Cuando se juntan dos pronombres, el indirecto va primero. Ante el verbo, em, et, es y ens cambian de forma: em + el = me'l, et + en = te'n, em + ho = m'ho, em + les = me les, es + en = se'n.\n\nCon li, en catalán central li + el y li + ho se dicen l'hi (también son correctas li'l y li ho): Li dono el llibre → L'hi dono. Nunca uses «se lo» como en español. En plural: els + ho = els ho, ens + en = ens en, us + en = us en.\n\nCon haver-hi, hi + en da n'hi: N'hi ha molts. Los verbos como anar-se'n llevan en: me'n vaig, se'n va. Detrás del imperativo, con guion: Deixa-me'l. Explica-m'ho.",
    items: [
      "Aquest llibre sembla interessant. ___ deixes? (a mi)|Me'l|Em el;El me;Me lo|Este libro parece interesante. ¿Me lo prestas?|Em + el ante el verbo: me'l.",
      "Tens caramels? ___ dones un? (a mi)|Me'n|Em en;Me el;Me lo|¿Tienes caramelos? ¿Me das uno?|Em + en (cantidad) ante el verbo: me'n.",
      "Què ha passat? Ara ___ explico. (a tu)|t'ho|te ho;te lo|¿Qué ha pasado? Ahora te lo explico.|Et + ho: t'ho, la e se elide ante ho.",
      "Si la Laia vol el cotxe, ___ deixo.|l'hi;li'l|li el;se lo;el li|Si Laia quiere el coche, se lo dejo.|Li + el: l'hi en catalán central (también li'l). Nunca «se lo».",
      "Li has dit que vindràs? Sí, ja ___ he dit.|l'hi;li ho|se lo;se ho|¿Le has dicho que vendrás? Sí, ya se lo he dicho.|Li + ho: l'hi en catalán central, o li ho.",
      "Hi ha pa? Sí, ___ ha molt.|n'hi|en hi;hi en|¿Hay pan? Sí, hay mucho.|Hi + en con haver-hi: n'hi ha.",
      "Necessito les claus. ___ portes, si us plau? (a mi)|Me les|Em les;Me'ls;Les me|Necesito las llaves. ¿Me las traes, por favor?|Em + les ante el verbo: me les.",
      "Quan acabis el llibre, deixa-___. (a mi)|me'l|m'el;em el;me lo|Cuando acabes el libro, déjamelo.|Detrás del imperativo: deixa-me'l.",
      "Si teniu fotos, ___ podeu enviar? (a nosaltres)|ens en|nos en;en ens|Si tenéis fotos, ¿nos podéis enviar algunas?|Ens + en ante consonante: ens en.",
      "Si vols vi, ___ porto una ampolla. (a tu)|te'n|t'en;te en;te lo|Si quieres vino, te traigo una botella.|Et + en ante el verbo: te'n.",
      "Explica-___ tot, si us plau. (a mi)|m'ho|me ho;me'l;me lo|Explícamelo todo, por favor.|Em + ho detrás del imperativo: explica-m'ho.",
      "El tren ja ___ va.|se'n|s'en;se en;se|El tren ya se va.|Anar-se'n lleva en: se'n va.",
      "Si voleu llibres, ___ deixo dos. (a vosaltres)|us en|en us;os en|Si queréis libros, os dejo dos.|Us + en ante consonante: us en.",
      "Ho saben els teus pares? Sí, ja ___ he explicat. (a ells)|els ho|se lo;les ho;los ho|¿Lo saben tus padres? Sí, ya se lo he explicado.|Els + ho: els ho. Nunca «se lo»."
    ] },

  { id: 'subjuntiu', name: 'Cuándo usar subjuntivo', cefr: 'B2', icon: '💭',
    tip: "Como en español, el subjuntivo aparece tras verbos de deseo, petición o emoción cuando cambia el sujeto: Vull que vinguis. M'agrada que em visitin. Espero que tingueu bon viatge.\n\nCon quan referido al futuro se usa subjuntivo, nunca futuro: Quan arribis, truca'm. Perquè de finalidad (para que) lleva subjuntivo: Parla a poc a poc perquè t'entenguem. Perquè causal (porque) lleva indicativo: Me'n vaig perquè estic cansat. Encara que con un hecho hipotético también va en subjuntivo: Encara que plogui, sortirem.\n\nFormas útiles: vingui, tingui, pugui, sigui, faci, surti, sàpiga, escrigui, llegeixi.",
    items: [
      "Vull que ___ a la festa. (venir, tu)|vinguis|vens;vindràs;venir|Quiero que vengas a la fiesta.|Querer que + otro sujeto: subjuntivo, vinguis.",
      "Quan ___ a casa, truca'm. (arribar, tu)|arribis|arribaràs;arribar;arribaries|Cuando llegues a casa, llámame.|Quan referido al futuro: subjuntivo, nunca futuro.",
      "T'ho dic perquè ho ___. (saber, tu)|sàpigues;sàpies|saps;saber;sàpiga|Te lo digo para que lo sepas.|Perquè de finalidad (para que): subjuntivo, sàpigues.",
      "Me'n vaig a dormir perquè ___ cansat. (estar, jo)|estic|estigui;estiguis|Me voy a dormir porque estoy cansado.|Perquè causal (porque): indicativo, estic.",
      "Encara que demà ___, sortirem a passejar. (ploure)|plogui|ploure;plovia|Aunque mañana llueva, saldremos a pasear.|Encara que con un hecho futuro o hipotético: subjuntivo, plogui.",
      "M'agrada que els meus amics em ___. (visitar)|visitin|visitaran;visitar|Me gusta que mis amigos me visiten.|Emoción + que con otro sujeto: subjuntivo, visitin.",
      "Espero que ___ un bon viatge. (tenir, vosaltres)|tingueu|teniu;tenir|Espero que tengáis un buen viaje.|Esperar que (deseo): subjuntivo, tingueu.",
      "És important que ___ cada dia. (llegir, tu)|llegeixis|llegeixes;llegiràs;llegir|Es importante que leas cada día.|És important que: subjuntivo, llegeixis.",
      "Quan ___ gran, seré metge. (ser, jo)|sigui|seré;sóc|Cuando sea mayor, seré médico.|Quan con valor de futuro: subjuntivo, sigui.",
      "Parla a poc a poc perquè t'___. (entendre, nosaltres)|entenguem|entenem;entendrem;entendre|Habla despacio para que te entendamos.|Perquè de finalidad: subjuntivo, entenguem.",
      "Truca'm abans que ___ el tren. (sortir)|surti|surt;sortirà;sortir|Llámame antes de que salga el tren.|Abans que siempre va con subjuntivo: surti.",
      "Tant de bo ___ bon temps demà! (fer)|faci|fa;farà;fer|¡Ojalá haga buen tiempo mañana!|Tant de bo (ojalá) va con subjuntivo: faci.",
      "La professora vol que els alumnes ___ en català. (escriure)|escriguin|escriuen;escriuran;escriure|La profesora quiere que los alumnos escriban en catalán.|Voler que + otro sujeto: subjuntivo, escriguin.",
      "Quan ___ temps, vindré a veure't. (tenir, jo)|tingui|tindré;tinc;tenir|Cuando tenga tiempo, vendré a verte.|Quan referido al futuro: subjuntivo, tingui."
    ] },

  { id: 'connectors', name: 'Conectores', cefr: 'B2', icon: '🌉',
    tip: "Los conectores organizan el discurso. Tanmateix y no obstant això (sin embargo) y en canvi (en cambio) contrastan. Per tant, per això y així que introducen una consecuencia. Ja que y com que (como) introducen la causa, y com que va siempre al principio: Com que plovia, no vam sortir.\n\nMalgrat que, tot i que y encara que introducen una concesión con verbo conjugado. Con un nombre se usa malgrat o tot i: malgrat la pluja. Con infinitivo, tot i: tot i ser tard. És a dir aclara y d'altra banda añade otro argumento.\n\nOjo: doncs significa «pues» de consecuencia, nunca «porque». Para la causa usa perquè o ja que.",
    items: [
      "Plovia molt. ___, vam sortir a córrer.|Tanmateix;No obstant això;Malgrat això|Per tant;Ja que;És a dir|Llovía mucho. Sin embargo, salimos a correr.|Contraste con lo anterior: tanmateix (sin embargo).",
      "No tinc diners, ___ no puc anar de viatge.|per tant;així que;per això|tanmateix;ja que;malgrat que|No tengo dinero, por lo tanto no puedo ir de viaje.|Consecuencia: per tant (por lo tanto).",
      "No vindré a sopar ___ estic molt cansat.|perquè;ja que|doncs;per tant;tanmateix|No vendré a cenar porque estoy muy cansado.|Causa: perquè o ja que. Doncs no introduce la causa en catalán.",
      "___ plovia, ens vam quedar a casa.|Com que;Ja que|Doncs;Per tant;Tanmateix|Como llovía, nos quedamos en casa.|Causa al principio de la frase: com que.",
      "___ estava cansada, va anar a la feina.|Malgrat que;Tot i que;Encara que|Ja que;Per tant;Com que|Aunque estaba cansada, fue a trabajar.|Concesión con verbo conjugado: malgrat que o tot i que.",
      "Treballa al sector sanitari, ___, és infermera.|és a dir|tanmateix;ja que;malgrat|Trabaja en el sector sanitario, es decir, es enfermera.|Aclaración: és a dir.",
      "El pis és petit. ___, és molt cèntric.|D'altra banda;En canvi;Tanmateix|Per tant;És a dir;Ja que|El piso es pequeño. Por otra parte, es muy céntrico.|Otro aspecto de la cuestión: d'altra banda.",
      "___ la pluja, el partit es va jugar.|Malgrat;Tot i|Malgrat que;Ja que;Per tant|A pesar de la lluvia, el partido se jugó.|Malgrat + nombre. Malgrat que solo va con verbo conjugado.",
      "Avui és festa, ___ les botigues són tancades.|per tant;per això;així que|ja que;tanmateix;malgrat que|Hoy es festivo, por lo tanto las tiendas están cerradas.|Consecuencia: per tant.",
      "Tot i ___ tard, encara hi havia gent al carrer.|ser|és;era|Aunque era tarde, todavía había gente en la calle.|Tot i + infinitivo: tot i ser tard (aunque era tarde).",
      "ORDER|Com que no tenia cotxe, vaig agafar el tren.|Como no tenía coche, cogí el tren.|Com que introduce la causa y va al principio de la frase.",
      "ORDER|No ha estudiat, per tant suspendrà l'examen.|No ha estudiado, por lo tanto suspenderá el examen.|Per tant introduce una consecuencia.",
      "ORDER|Malgrat que fa fred, anirem a la platja.|Aunque hace frío, iremos a la playa.|Malgrat que va seguido de un verbo conjugado.",
      "ORDER|Arribaré demà, és a dir, dijous.|Llegaré mañana, es decir, el jueves.|És a dir introduce una aclaración."

      'Setz dich neben ___ Oma! (dein)|deine|deiner;deinem;deinen|¡Siéntate al lado de tu abuela!|Wohin? Sich setzen indica movimiento: acusativo, neben deine Oma.',
      'Er sitzt neben ___ Freundin. (sein)|seiner|seine;seinem;seinen|Está sentado al lado de su novia.|Wo? Sitzen es posición: dativo, neben seiner Freundin.',
      'Das Auto steht vor ___ Haus. (das)|dem|das;den;der|El coche está delante de la casa.|Wo? Stehen es posición: dativo, vor dem Haus.',
      'Am Wochenende fahren wir ___ Meer.|ans;an das|im;an;nach|El fin de semana vamos al mar.|Wohin? Destino: acusativo, an + das = ans Meer.',
      'Die Lampe hängt über ___ Tisch. (der)|dem|den;der;das|La lámpara cuelga encima de la mesa.|Wo? Posición: dativo, über dem Tisch.',
      'Die Bank ist zwischen ___ Post und dem Supermarkt. (die)|der|die;dem;den|El banco está entre la oficina de correos y el supermercado.|Wo? Situación: dativo, zwischen der Post und dem Supermarkt.',
    ] },

  { id: 'pronomen', name: 'Pronombres personales en acusativo y dativo', cefr: 'B1', icon: '👤',
    tip: 'Los pronombres personales cambian según el caso.\nNominativo: ich, du, er, sie, es, wir, ihr, sie, Sie.\nAcusativo: mich, dich, ihn, sie, es, uns, euch, sie, Sie.\nDativo: mir, dir, ihm, ihr, ihm, uns, euch, ihnen, Ihnen.\n\nAcusativo para el complemento directo y tras verbos como sehen, besuchen, kennen o lieben: Ich liebe dich. Dativo para el complemento indirecto y con helfen, danken, gefallen o schmecken: Ich gebe dir das Buch.\n\nEn español decimos «lo» o «le». En alemán: ihn (complemento directo) frente a ihm (indirecto). Y ojo: ihr es también «a ella» en dativo. Si los dos complementos son pronombres, el acusativo va primero: Ich gebe es dir.',
    items: [
      'Kannst du ___ helfen? (ich)|mir|mich;ich;mein|¿Puedes ayudarme?|Helfen rige dativo: ich → mir.',
      'Ich liebe ___ sehr. (du)|dich|dir;du;dein|Te quiero mucho.|Lieben rige acusativo: du → dich.',
      'Kennst du Thomas? Ja, ich kenne ___ gut. (er)|ihn|ihm;er;sein|¿Conoces a Thomas? Sí, lo conozco bien.|Kennen lleva complemento directo: er → ihn.',
      'Ich habe ___ gestern eine E-Mail geschrieben. (er)|ihm|ihn;er;sein|Ayer le escribí un correo electrónico.|Él recibe el correo: complemento indirecto en dativo, er → ihm.',
      'Wie geht es ___, Herr Müller? (Sie)|Ihnen|Sie;Ihren;Ihrer|¿Cómo está usted, señor Müller?|Es geht + dativo: Sie → Ihnen.',
      'Wo ist Maria? Ich sehe ___ nicht. (sie)|sie|ihr;ihn;ihre|¿Dónde está María? No la veo.|Sehen rige acusativo. Sie (ella) no cambia en acusativo.',
      'Der Kuchen schmeckt ___ sehr gut. (wir)|uns|wir;unser;unsere|El pastel nos gusta mucho.|Schmecken rige dativo: wir → uns (igual que en acusativo).',
      'Ich rufe ___ morgen an. (ihr)|euch|ihr;euer;eure|Os llamo mañana.|Anrufen lleva acusativo: ihr → euch.',
      'Gefällt ___ das Hotel? (du)|dir|dich;du;dein|¿Te gusta el hotel?|Gefallen rige dativo: du → dir.',
      'Das Geschenk ist für ___. (er)|ihn|ihm;er;sein|El regalo es para él.|Für rige acusativo: er → ihn.',
      'Ich gehe mit ___ ins Kino. (sie = ella)|ihr|sie;ihn;ihre|Voy al cine con ella.|Mit rige dativo: sie (ella) → ihr.',
      'Wo ist mein Schlüssel? Ich finde ___ nicht. (er)|ihn|ihm;er;sie|¿Dónde está mi llave? No la encuentro.|Schlüssel es masculino: el pronombre de complemento directo es ihn, aunque digamos «la».',
      'Gibst du mir das Buch? Ja, ich gebe es ___ gleich. (du)|dir|dich;du;dein|¿Me das el libro? Sí, ahora te lo doy.|Quien recibe va en dativo: du → dir.',
      'Wir besuchen ___ am Sonntag. (sie = ellos)|sie|ihnen;ihr;sich|Los visitamos el domingo.|Besuchen rige acusativo: sie (ellos) no cambia. Ihnen sería dativo.',
    ] },

  { id: 'wortstellung', name: 'Orden de palabras: verbo en segunda posición y al final', cefr: 'B1', icon: '🧩',
    tip: 'En la oración principal, el verbo conjugado ocupa siempre la segunda posición. Si empiezas por otro elemento (un adverbio, un complemento), el sujeto pasa detrás del verbo: Heute gehe ich ins Kino (nunca «Heute ich gehe»).\n\nCon tiempos compuestos y modales se forma un paréntesis: el verbo conjugado en segunda posición y el participio o el infinitivo al final: Ich habe gestern Fußball gespielt. Ich muss morgen arbeiten.\n\nEn las subordinadas con weil, dass, wenn, ob y similares, el verbo conjugado va al final: Ich bleibe zu Hause, weil ich krank bin. Si la subordinada va primero, la principal empieza por el verbo: Wenn ich Zeit habe, rufe ich dich an.',
    items: [
      'ORDER|Heute gehe ich ins Kino.|Hoy voy al cine.|Si la frase empieza por heute, el verbo va en 2.ª posición y el sujeto detrás.',
      'ORDER|Ich habe gestern Fußball gespielt.|Ayer jugué al fútbol.|Perfekt: habe en 2.ª posición y el participio gespielt al final.',
      'ORDER|Ich muss morgen früh arbeiten.|Tengo que trabajar mañana por la mañana.|Con modal: muss en 2.ª posición y el infinitivo arbeiten al final.',
      'ORDER|Ich bleibe zu Hause, weil ich krank bin.|Me quedo en casa porque estoy enfermo.|Tras weil, el verbo conjugado (bin) va al final de la subordinada.',
      'ORDER|Ich weiß, dass er heute nicht kommt.|Sé que hoy no viene.|Tras dass, el verbo conjugado (kommt) va al final.',
      'ORDER|Wenn ich Zeit habe, rufe ich dich an.|Si tengo tiempo, te llamo.|La subordinada ocupa la 1.ª posición, así que la principal empieza por el verbo: rufe ich… an.',
      'ORDER|Kannst du mir sagen, ob der Zug pünktlich ist?|¿Me puedes decir si el tren llega puntual?|Ob introduce una pregunta indirecta: el verbo (ist) va al final.',
      'ORDER|Am Wochenende besuchen wir unsere Großeltern.|El fin de semana visitamos a nuestros abuelos.|Am Wochenende ocupa la 1.ª posición: el verbo va 2.º y el sujeto wir detrás.',
      'ORDER|Morgen will ich früher aufstehen.|Mañana quiero levantarme más temprano.|Modal en 2.ª posición tras morgen. El infinitivo aufstehen va al final.',
      'ORDER|Er sagt, dass er keine Zeit hat.|Dice que no tiene tiempo.|En la subordinada con dass, el verbo hat va al final.',
      'ORDER|Ich lerne Deutsch, weil ich in Berlin arbeiten möchte.|Aprendo alemán porque quiero trabajar en Berlín.|En la subordinada, el modal conjugado (möchte) va detrás del infinitivo, al final.',
      'Ich weiß nicht, ob ___. (er / morgen / kommen)|er morgen kommt|er kommt morgen;kommt er morgen;morgen kommt er|No sé si viene mañana.|En la subordinada con ob, el verbo conjugado va al final: ob er morgen kommt.',
      'Heute Abend ___ ins Theater. (wir / gehen)|gehen wir|wir gehen;wir gehe;gehe wir|Esta noche vamos al teatro.|Heute Abend ocupa la 1.ª posición: el verbo va 2.º y el sujeto detrás.',
      'Ich komme nicht, weil ___. (ich / müssen / arbeiten)|ich arbeiten muss|ich muss arbeiten;muss ich arbeiten;ich arbeite muss|No vengo porque tengo que trabajar.|Tras weil, el verbo conjugado va al final, detrás del infinitivo: weil ich arbeiten muss.',
    ] },

  { id: 'trennbar', name: 'Verbos separables e inseparables', cefr: 'B1', icon: '✂️',
    tip: 'Muchos verbos llevan prefijo. Si es separable (an, auf, aus, ein, mit, zu, zurück, fern…), en presente y en Präteritum se separa y va al final de la frase: aufstehen → Ich stehe um sieben Uhr auf. En el participio, ge- va entre el prefijo y el verbo: aufgestanden, eingekauft. Con zu ocurre lo mismo: anzurufen.\n\nLos prefijos inseparables (be-, emp-, ent-, er-, ge-, miss-, ver-, zer-) nunca se separan y su participio no lleva ge-: besuchen → Ich besuche dich, ich habe dich besucht.\n\nEn las subordinadas, el verbo separable vuelve a unirse al final: …, weil ich früh aufstehe. Pista: en los separables el acento cae en el prefijo (ANrufen). En los inseparables, en la raíz (beSUchen).',
    items: [
      'Ich ___ jeden Tag um sieben Uhr auf.|stehe|aufstehe;stehen;steht|Me levanto todos los días a las siete.|Aufstehen es separable: stehe… auf, con el prefijo al final.',
      'Wann ___ der Zug in Hamburg an?|kommt|ankommt;kommen;angekommen|¿Cuándo llega el tren a Hamburgo?|Ankommen es separable: kommt… an.',
      'Ich rufe dich morgen ___.|an|ein;mit;bei|Te llamo mañana.|Anrufen es separable: el prefijo an va al final de la frase.',
      'Gestern habe ich im Supermarkt ___.|eingekauft|geeinkauft;einkauft;eingekaufen|Ayer hice la compra en el supermercado.|En el participio de los separables, ge- va entre el prefijo y el verbo: eingekauft.',
      'Wir haben unsere Freunde in Wien ___.|besucht|gebesucht;begesucht;besuchtet|Hemos visitado a nuestros amigos en Viena.|Be- es inseparable: el participio no lleva ge-, besucht.',
      'Ich ___ dir dieses Buch.|empfehle|empfiehlt;empfehlen;empfohlen|Te recomiendo este libro.|Emp- es inseparable: ich empfehle, sin separar el prefijo.',
      'Kannst du bitte das Fenster ___?|zumachen|machen zu;zugemacht;zumacht|¿Puedes cerrar la ventana, por favor?|Con modal, el verbo separable va unido en infinitivo al final: zumachen.',
      'Der Film fängt um acht Uhr ___.|an|auf;mit;ein|La película empieza a las ocho.|Anfangen es separable: fängt… an.',
      'Ich habe meine Brille ___. (verlieren)|verloren|geverloren;verliert;vergeloren|He perdido las gafas.|Ver- es inseparable: el participio no lleva ge-, verloren.',
      'Weißt du, wann der Bus ___? (abfahren)|abfährt|fährt ab;abgefahren;ab fährt|¿Sabes cuándo sale el autobús?|En la subordinada, el verbo separable se une al final: wann der Bus abfährt.',
      'Ich habe vergessen, dich ___. (anrufen)|anzurufen|zu anrufen;anrufen;angerufen|Se me ha olvidado llamarte.|Con los separables, zu va entre el prefijo y el verbo: anzurufen.',
      'Hörst du mir ___?|zu|mit;auf;ein|¿Me estás escuchando?|Zuhören es separable y rige dativo: Hörst du mir zu?',
      'Wir ___ heute Abend fern. (fernsehen)|sehen|fernsehen;sieht;gesehen|Esta noche vemos la tele.|Fernsehen es separable: sehen… fern.',
      'Er hat mir die Regel gut ___. (erklären)|erklärt|ergeklärt;geerklärt;erklären|Me ha explicado bien la regla.|Er- es inseparable: el participio no lleva ge-, erklärt.',
    ] },

  { id: 'adjektiv', name: 'Declinación del adjetivo', cefr: 'B1', icon: '🎨',
    tip: 'El adjetivo lleva terminación delante del sustantivo, pero no después de sein: Der Wein ist rot, pero der rote Wein.\n\nTras der, die, das (y dieser, jeder): -e en nominativo singular y en acusativo femenino y neutro. En todo lo demás, -en: der alte Mann, den alten Mann, mit dem alten Mann, die alten Männer.\n\nTras ein, kein, mein: el adjetivo marca el género cuando el artículo no lo hace: ein alter Mann, ein kleines Kind, eine neue Wohnung. En dativo y en plural, -en: mit einem alten Freund, keine guten Ideen.\n\nSin artículo, el adjetivo toma la terminación del artículo determinado: kalter Kaffee, frische Milch, mit heißem Wasser.',
    items: [
      'Der ___ Mann wohnt hier. (alt)|alte|alter;alten;altes|El hombre mayor vive aquí.|Tras der en nominativo singular, el adjetivo termina en -e.',
      'Ich habe einen ___ Hund. (klein)|kleinen|kleiner;kleine;kleines|Tengo un perro pequeño.|Acusativo masculino tras einen: -en.',
      'Das ist ein ___ Auto. (neu)|neues|neue;neuen;neuer|Es un coche nuevo.|Tras ein, el adjetivo marca el neutro: -es.',
      'Wir wohnen in einer ___ Wohnung. (groß)|großen|große;großer;großes|Vivimos en un piso grande.|Dativo (in + wo?) tras einer: el adjetivo termina en -en.',
      'Ich trinke gern ___ Kaffee. (schwarz)|schwarzen|schwarzer;schwarze;schwarzes|Me gusta el café solo.|Sin artículo, acusativo masculino: -en, como den.',
      'Er hat ___ Augen. (blau)|blaue|blauen;blauer;blaues|Tiene los ojos azules.|Plural sin artículo en acusativo: -e, como die.',
      'Wasch das Hemd nicht mit ___ Wasser! (heiß)|heißem|heißen;heißes;heiße|¡No laves la camisa con agua caliente!|Sin artículo, dativo neutro: -em, como dem.',
      'Die ___ Schuhe sind zu teuer. (rot)|roten|rote;roter;rotes|Los zapatos rojos son demasiado caros.|Tras die en plural, el adjetivo termina siempre en -en.',
      'Kennst du den ___ Lehrer? (neu)|neuen|neue;neuer;neues|¿Conoces al profesor nuevo?|Acusativo masculino tras den: -en.',
      'Das ist eine sehr ___ Idee. (gut)|gute|guten;guter;gutes|Es una idea muy buena.|Nominativo femenino tras eine: -e.',
      'Ich esse gern ___ Brot. (frisch)|frisches|frischen;frischer;frische|Me gusta comer pan recién hecho.|Sin artículo, acusativo neutro: -es, como das.',
      'Er spricht mit dem ___ Kellner. (freundlich)|freundlichen|freundliche;freundlicher;freundliches|Habla con el camarero amable.|Tras dem (dativo), el adjetivo termina siempre en -en.',
      'Der Kaffee ist ___. (kalt)|kalt|kalte;kalter;kalten|El café está frío.|Tras sein, el adjetivo no se declina: der Kaffee ist kalt.',
      'Das ist ein ___ Film. (interessant)|interessanter|interessante;interessanten;interessantes|Es una película interesante.|Tras ein en nominativo masculino, el adjetivo marca el género: -er.',
    ] },

  { id: 'relativ', name: 'Pronombres relativos', cefr: 'B2', icon: '🔗',
    tip: 'El pronombre relativo concuerda en género y número con el sustantivo al que se refiere, pero su caso depende de la función que cumple dentro de la oración relativa. El verbo conjugado va al final.\n\nNominativo: der, die, das, die (plural). Acusativo: den, die, das, die. Dativo: dem, der, dem, denen. Genitivo: dessen (masculino y neutro), deren (femenino y plural).\n\nDer Mann, der dort steht (sujeto). Der Mann, den ich kenne (complemento directo). Der Mann, dem ich helfe (dativo). Der Mann, dessen Auto rot ist (cuyo).\n\nCon preposición, esta va delante del relativo: die Stadt, in der ich wohne. A diferencia del español, la preposición nunca va al final y el relativo nunca se omite.',
    items: [
      'Der Mann, ___ dort steht, ist mein Chef.|der;welcher|den;dem;die|El hombre que está allí es mi jefe.|Mann es masculino y el relativo es sujeto: nominativo, der.',
      'Die Frau, ___ ich gestern getroffen habe, ist Ärztin.|die;welche|der;den;deren|La mujer a la que vi ayer es médica.|Femenino y complemento directo: el acusativo femenino es die.',
      'Das ist der Film, ___ ich dir empfohlen habe.|den;welchen|der;dem;das|Esta es la película que te recomendé.|Film es masculino y complemento directo de empfehlen: acusativo, den.',
      'Das Kind, ___ wir helfen, ist sieben Jahre alt.|dem;welchem|das;den;der|El niño al que ayudamos tiene siete años.|Kind es neutro y helfen rige dativo: dem.',
      'Die Leute, ___ ich geschrieben habe, haben nicht geantwortet.|denen;welchen|den;die;deren|Las personas a las que escribí no han contestado.|Plural en dativo (jemandem schreiben): denen.',
      'Der Kollege, ___ Frau Spanierin ist, spricht gut Spanisch.|dessen|deren;dem;der|El compañero cuya mujer es española habla bien español.|Posesivo (cuyo) referido a un masculino: dessen.',
      'Die Nachbarin, ___ Hund immer bellt, ist sehr nett.|deren|dessen;der;die|La vecina cuyo perro siempre ladra es muy simpática.|Posesivo referido a un femenino: deren, aunque Hund sea masculino.',
      'Das ist die Stadt, in ___ ich geboren bin.|der;welcher|die;dem;den|Esta es la ciudad en la que nací.|In + dativo (wo?). Stadt es femenino: in der.',
      'Das Hotel, in ___ wir übernachtet haben, war sehr teuer.|dem;welchem|das;den;der|El hotel en el que nos alojamos era muy caro.|Wo? → dativo. Hotel es neutro: in dem.',
      'Das Buch, ___ auf dem Tisch liegt, gehört mir.|das;welches|dem;den;der|El libro que está sobre la mesa es mío.|Buch es neutro y el relativo es sujeto: das.',
      'Die Freunde, mit ___ ich in Urlaub fahre, kommen aus Köln.|denen;welchen|den;die;deren|Los amigos con los que me voy de vacaciones son de Colonia.|Mit rige dativo. En plural, el relativo es denen.',
      'Das Mädchen, ___ Vater Arzt ist, heißt Lena.|dessen|deren;dem;das|La chica cuyo padre es médico se llama Lena.|Mädchen es neutro: el posesivo relativo es dessen.',
      'ORDER|Das ist der Mann, der mir geholfen hat.|Este es el hombre que me ayudó.|En la oración relativa, el verbo conjugado (hat) va al final.',
      'ORDER|Ich suche eine Wohnung, die nicht zu teuer ist.|Busco un piso que no sea demasiado caro.|En la relativa, el verbo (ist) va al final.',
    ] },

  { id: 'passiv', name: 'La voz pasiva con werden', cefr: 'B2', icon: '⚙️',
    tip: 'La pasiva de proceso se forma con werden + participio: Das Haus wird gebaut (se está construyendo la casa). Se usa mucho más que en español, donde solemos decir «se» + verbo: Hier wird Deutsch gesprochen (aquí se habla alemán).\n\nTiempos: presente wird gebaut, Präteritum wurde gebaut, Perfekt ist gebaut worden (¡worden, sin ge-, y con sein!). Con modal: muss gebaut werden.\n\nEl agente se introduce con von + dativo: Das Fenster wurde von meinem Bruder geöffnet. Para una causa o un medio se usa durch + acusativo: Die Stadt wurde durch ein Erdbeben zerstört.',
    items: [
      'Hier ___ Deutsch gesprochen.|wird|werden;hat;wurden|Aquí se habla alemán.|Pasiva en presente: werden conjugado (wird) + participio.',
      'Das Rathaus ___ im Jahr 1890 gebaut.|wurde|worden;wurden;hat|El ayuntamiento se construyó en 1890.|Pasiva en Präteritum: wurde + participio.',
      'Die Pakete ___ morgen verschickt.|werden|wird;worden;wurde|Los paquetes se envían mañana.|Pasiva en presente con sujeto plural: werden + participio.',
      'Das Auto ist schon repariert ___.|worden|geworden;werden;wurde|Ya han arreglado el coche.|En el Perfekt de la pasiva se usa worden, sin ge-: ist repariert worden.',
      'Der Text muss bis Freitag übersetzt ___.|werden|worden;wird;wurde|Hay que traducir el texto antes del viernes.|Pasiva con modal: modal + participio + werden en infinitivo.',
      'Die Fenster ___ gestern geputzt.|wurden|wurde;werden;worden|Las ventanas se limpiaron ayer.|Pasiva en Präteritum con sujeto plural: wurden + participio.',
      'Das Fenster wurde ___ meinem Bruder geöffnet.|von|durch;für;gegen|La ventana la abrió mi hermano.|La persona que realiza la acción se introduce con von + dativo.',
      'Die Stadt wurde ___ ein Erdbeben zerstört.|durch|von;mit;bei|La ciudad fue destruida por un terremoto.|Para la causa o el medio se usa durch + acusativo: durch ein Erdbeben.',
      'Wann ___ das Museum geöffnet?|wird|werden;wurden;worden|¿Cuándo se abre el museo?|Pasiva en presente: wird + participio.',
      'Die Rechnung kann auch online bezahlt ___.|werden|worden;wird;wurde|La factura también se puede pagar por internet.|Modal + participio + werden: kann bezahlt werden.',
      'In Spanien ___ spät zu Abend gegessen.|wird|werden;ist;hat|En España se cena tarde.|Pasiva impersonal: wird + participio, equivale a «se» + verbo.',
      'Das Paket ist gestern ___ worden.|geliefert|liefern;lieferte;lieferten|El paquete se entregó ayer.|Perfekt de la pasiva: ist + participio + worden.',
      'Die Straße ___ gerade repariert.|wird|werden;wurden;worden|Ahora están arreglando la calle.|Pasiva en presente: wird + participio. Gerade indica que la acción está en curso.',
      'Der Dieb wurde von ___ Polizei gefasst.|der|die;dem;den|El ladrón fue detenido por la policía.|Von rige dativo: von der Polizei.',
    ] },

  { id: 'konnektoren', name: 'Conectores: obwohl, trotzdem, deshalb, damit…', cefr: 'B2', icon: '🔀',
    tip: 'Los conectores alemanes afectan al orden de las palabras.\n\nConjunciones subordinantes (verbo al final): obwohl (aunque), damit (para que), sodass (de modo que), während (mientras): Ich gehe spazieren, obwohl es regnet.\n\nAdverbios conectores: ocupan la primera posición, así que el verbo va justo detrás. Trotzdem (aun así), deshalb o deswegen (por eso): Es regnet, trotzdem gehe ich spazieren.\n\nEinerseits…, andererseits… (por un lado…, por otro…) funciona igual: Einerseits ist die Wohnung schön, andererseits ist sie zu teuer.\n\nObwohl y trotzdem expresan lo mismo con estructuras distintas. Damit indica finalidad con sujetos distintos. Con el mismo sujeto se prefiere um… zu.',
    items: [
      'Ich gehe spazieren, ___ es regnet.|obwohl|trotzdem;deshalb;einerseits|Salgo a pasear aunque llueve.|Obwohl introduce una subordinada concesiva: el verbo (regnet) va al final.',
      'Es regnet, ___ gehe ich spazieren.|trotzdem|obwohl;während;damit|Llueve, pero aun así salgo a pasear.|Trotzdem es un adverbio: ocupa una posición y el verbo (gehe) va justo detrás.',
      'Ich bin müde, ___ gehe ich früh ins Bett.|deshalb;deswegen;darum|obwohl;damit;während|Estoy cansado, por eso me voy pronto a la cama.|Deshalb ocupa la 1.ª posición y el verbo va justo detrás: gehe ich.',
      'Ich spreche langsam, ___ du mich verstehst.|damit|deshalb;trotzdem;um|Hablo despacio para que me entiendas.|Damit indica finalidad con otro sujeto (du) y manda el verbo al final.',
      'Es hat stark geschneit, ___ die Schule geschlossen blieb.|sodass;so dass|trotzdem;deshalb;andererseits|Nevó mucho, de modo que el colegio permaneció cerrado.|Sodass expresa una consecuencia y lleva el verbo al final.',
      '___ ich koche, deckst du den Tisch.|Während|Trotzdem;Deshalb;Einerseits|Mientras yo cocino, tú pones la mesa.|Während es subordinante: verbo al final (koche) y la principal empieza por el verbo.',
      '___ ist die Stadt schön, andererseits ist sie sehr teuer.|Einerseits|Andererseits;Obwohl;Während|Por un lado, la ciudad es bonita, pero por otro es muy cara.|Einerseits… andererseits… ocupan la 1.ª posición y el verbo va detrás.',
      'ORDER|Obwohl er krank ist, geht er zur Arbeit.|Aunque está enfermo, va a trabajar.|Obwohl manda el verbo al final. Después, la principal empieza por el verbo (geht).',
